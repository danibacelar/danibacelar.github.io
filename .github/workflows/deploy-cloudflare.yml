name: Deploy webapp to Cloudflare

on:
  push:
    branches:
      - claude/upbeat-hopper-sj0sji
    paths:
      - "webapp/**"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - run: npm ci

      - run: npx opennextjs-cloudflare build
        env:
          # Supabase project URL + "publishable" key: safe to expose client-side
          # by design (this is what they're for), so no need for GitHub Secrets.
          NEXT_PUBLIC_SUPABASE_URL: https://kovwnplaeqejvhdhqnrh.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_1Uc5ruCEgoWpEf_w5UXRBA_YbwB58m1

      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
