name: Deploy webapp to Cloudflare

on:
  push:
    branches:
      - claude/upbeat-hopper-sj0sji
    paths:
      - "webapp/**"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - run: npm ci

      # O build do Next.js busca as fontes do Google (Fraunces/Inter) pela
      # rede na hora de compilar — às vezes o runner do GitHub Actions
      # falha nessa busca (instabilidade de rede, não é bug do código).
      # Tenta até 3 vezes antes de desistir de verdade.
      - name: Build (com retry por instabilidade do Google Fonts)
        run: |
          for tentativa in 1 2 3; do
            if npx opennextjs-cloudflare build; then
              exit 0
            fi
            echo "Build falhou (tentativa $tentativa/3) — tentando de novo em 10s..."
            sleep 10
          done
          exit 1
        env:
          # Supabase project URL + "publishable" key: safe to expose client-side
          # by design (this is what they're for), so no need for GitHub Secrets.
          NEXT_PUBLIC_SUPABASE_URL: https://kovwnplaeqejvhdhqnrh.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_1Uc5ruCEgoWpEf_w5UXRBA_YbwB58m1

      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Atualizar secrets do Mercado Pago no Worker
        run: |
          echo "${{ secrets.MERCADOPAGO_ACCESS_TOKEN_TEST }}" | npx wrangler secret put MERCADOPAGO_ACCESS_TOKEN
          echo "${{ secrets.MERCADOPAGO_WEBHOOK_SECRET_TEST }}" | npx wrangler secret put MERCADOPAGO_WEBHOOK_SECRET
          echo "${{ secrets.PIX_RPC_SECRET }}" | npx wrangler secret put PIX_RPC_SECRET
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
