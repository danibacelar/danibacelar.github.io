<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogos de Inglês — Mrs. Dani</title>
<meta name="description" content="Jogos de inglês por ano escolar, habilidade e dificuldade — criados a partir dos conteúdos que as crianças estudam na escola.">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/components.css">
</head>
<body data-asset-prefix="../">

<nav class="nav">
  <div class="wrap">
    <a href="../index.html" class="brand">Mrs. <span>Dani</span></a>
    <ul class="nav-links">
      <li><a href="index.html" class="active" data-i18n="nav.games">Jogos</a></li>
      <li><a href="../index.html#como-funciona" data-i18n="nav.how">Como funciona</a></li>
      <li><a href="../about/index.html" data-i18n="nav.about">Sobre</a></li>
      <li><a href="../login/index.html" data-i18n="nav.login">Entrar</a></li>
    </ul>
    <div class="nav-cta">
      <div class="lang-toggle">
        <button data-lang="pt" class="active">PT</button>
        <button data-lang="en">EN</button>
      </div>
      <button class="nav-toggle" aria-label="Open menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
    </div>
  </div>
</nav>

<header class="section" style="padding-bottom:0; padding-top:36px;">
  <div class="wrap section-head" style="margin-bottom:20px;">
    <p class="eyebrow" data-i18n="nav.games">Jogos</p>
    <h1 style="font-size:clamp(1.8rem,3.5vw,2.6rem);" data-i18n="library.title">Todos os jogos</h1>
    <p class="lede" data-i18n="library.lede">Encontre a atividade certa pelo ano escolar, pela habilidade ou pela dificuldade.</p>
  </div>
</header>

<section class="section" style="padding-top:16px;">
  <div class="wrap">
    <div class="search-bar">
      <input type="text" id="search-input" class="search-input" data-i18n-placeholder="library.searchPlaceholder" placeholder="Digite um nome..." aria-label="Buscar jogo pelo nome">
      <button class="search-btn" id="search-btn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <span data-i18n="library.search">Buscar</span>
      </button>
    </div>

    <div class="filter-toolbar" id="filter-toolbar">
      <div class="filter-dropdown">
        <button class="filter-dropdown-btn" type="button">
          <span data-i18n="library.grade">Ano escolar</span>
          <span class="filter-dropdown-count" hidden>0</span>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="filter-dropdown-panel">
          <label class="filter-option"><input type="checkbox" data-group="grade" value="3"> <span data-i18n="filter.grade3">3º ano</span></label>
          <label class="filter-option"><input type="checkbox" data-group="grade" value="4"> <span data-i18n="filter.grade4">4º ano</span></label>
          <label class="filter-option"><input type="checkbox" data-group="grade" value="5"> <span data-i18n="filter.grade5">5º ano</span></label>
          <label class="filter-option"><input type="checkbox" data-group="grade" value="8"> <span data-i18n="filter.grade8">8º ano</span></label>
        </div>
      </div>

      <div class="filter-dropdown">
        <button class="filter-dropdown-btn" type="button">
          <span data-i18n="library.skill">Habilidade</span>
          <span class="filter-dropdown-count" hidden>0</span>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="filter-dropdown-panel">
          <label class="filter-option"><input type="checkbox" data-group="skill" value="Bilingual"> <span data-i18n="filter.bilingual">Bilíngue</span></label>
          <label class="filter-option"><input type="checkbox" data-group="skill" value="Grammar"> <span data-i18n="filter.grammar">Gramática</span></label>
          <label class="filter-option"><input type="checkbox" data-group="skill" value="Vocabulary"> <span data-i18n="filter.vocabulary">Vocabulário</span></label>
          <label class="filter-option"><input type="checkbox" data-group="skill" value="Reading"> <span data-i18n="filter.reading">Leitura</span></label>
          <label class="filter-option"><input type="checkbox" data-group="skill" value="Writing"> <span data-i18n="filter.writing">Escrita</span></label>
          <label class="filter-option"><input type="checkbox" data-group="skill" value="Listening"> <span data-i18n="filter.listening">Escuta</span></label>
        </div>
      </div>

      <div class="filter-dropdown">
        <button class="filter-dropdown-btn" type="button">
          <span data-i18n="library.difficulty">Dificuldade</span>
          <span class="filter-dropdown-count" hidden>0</span>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="filter-dropdown-panel">
          <label class="filter-option"><input type="checkbox" data-group="difficulty" value="Beginner"> <span data-i18n="filter.beginner">Iniciante</span></label>
          <label class="filter-option"><input type="checkbox" data-group="difficulty" value="Intermediate"> <span data-i18n="filter.intermediate">Intermediário</span></label>
          <label class="filter-option"><input type="checkbox" data-group="difficulty" value="Advanced"> <span data-i18n="filter.advanced">Avançado</span></label>
        </div>
      </div>

      <div class="filter-dropdown">
        <button class="filter-dropdown-btn" type="button">
          <span data-i18n="library.category">Categoria</span>
          <span class="filter-dropdown-count" hidden>0</span>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="filter-dropdown-panel">
          <label class="filter-option"><input type="checkbox" data-group="collection" value="spelling-bee"> <span>🐝 Spelling Bee</span></label>
        </div>
      </div>
    </div>

    <div class="active-filters-row" id="active-filters-row" hidden>
      <div class="filter-chips" id="filter-chips"></div>
      <button class="filter-clear-all" id="filter-clear-all" data-i18n="library.clearAll">Limpar tudo</button>
    </div>
  </div>

  <div class="wrap" style="margin-top:24px;">
    <div class="library-results-head">
      <span class="library-count" id="library-count">—</span>
    </div>
    <div class="game-grid" id="game-grid"></div>
  </div>
</section>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-bottom">
      <span>© 2026 Mrs. Dani. All rights reserved.</span>
      <a href="../login/aluno.html" data-i18n="footer.studentAccess">Acesso do aluno →</a>
    </div>
  </div>
</footer>

<script src="../js/main.js"></script>
</body>
</html>
