<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogos de Inglês — Mrs. Dani</title>
<meta name="description" content="Jogos de inglês por ano escolar, habilidade e dificuldade — criados a partir dos conteúdos que as crianças estudam na escola.">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/components.css">
</head>
<body data-asset-prefix="../">

<nav class="nav">
  <div class="wrap">
    <a href="../index.html" class="brand">Mrs. <span>Dani</span></a>
    <ul class="nav-links">
      <li><a href="index.html" class="active" data-i18n="nav.games">Jogos</a></li>
      <li><a href="../index.html#como-funciona" data-i18n="nav.how">Como funciona</a></li>
      <li><a href="../about/index.html" data-i18n="nav.about">Sobre</a></li>
      <li><a href="../login/index.html" data-i18n="nav.login">Entrar</a></li>
    </ul>
    <div class="nav-cta">
      <div class="lang-toggle">
        <button data-lang="pt" class="active">PT</button>
        <button data-lang="en">EN</button>
      </div>
      <button class="nav-toggle" aria-label="Open menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
    </div>
  </div>
</nav>

<header class="section" style="padding-bottom:0;">
  <div class="wrap section-head">
    <p class="eyebrow" data-i18n="nav.games">Jogos</p>
    <h1 style="font-size:clamp(1.8rem,3.5vw,2.6rem);" data-i18n="library.title">Todos os jogos</h1>
    <p class="lede" data-i18n="library.lede">Encontre a atividade certa pelo ano escolar, pela habilidade ou pela dificuldade.</p>
  </div>
</header>

<section class="section" style="padding-top:32px;">
  <div class="wrap">
    <div class="filter-bar" id="filter-bar">
      <div class="filter-bar-top">
        <button class="filter-bar-toggle" id="filter-toggle" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
          <span data-i18n="library.filtersBtn">Filtros</span>
          <span class="filter-count" id="filter-bar-count" hidden>0</span>
        </button>
        <button class="filter-clear-all" id="filter-clear-all" hidden data-i18n="library.clearAll">Limpar tudo</button>
      </div>
      <div class="filter-chips" id="filter-chips"></div>
    </div>
  </div>
  <div class="wrap library-layout">
    <aside class="filters" id="filters-panel">
      <div class="filter-panel-head">
        <h3 data-i18n="library.filtersBtn">Filtros</h3>
        <button class="filter-panel-close" id="filter-panel-close" aria-label="Close">&times;</button>
      </div>
      <div class="filter-group">
        <h4 data-i18n="library.grade">Ano escolar</h4>
        <label class="filter-option"><input type="checkbox" data-group="grade" value="3"> 3º ano</label>
        <label class="filter-option"><input type="checkbox" data-group="grade" value="4"> 4º ano</label>
        <label class="filter-option"><input type="checkbox" data-group="grade" value="5"> 5º ano</label>
        <label class="filter-option"><input type="checkbox" data-group="grade" value="6"> 6º ano</label>
      </div>
      <div class="filter-group">
        <h4 data-i18n="library.skill">Habilidade</h4>
        <label class="filter-option"><input type="checkbox" data-group="skill" value="Grammar"> Gramática</label>
        <label class="filter-option"><input type="checkbox" data-group="skill" value="Vocabulary"> Vocabulário</label>
        <label class="filter-option"><input type="checkbox" data-group="skill" value="Reading"> Leitura</label>
        <label class="filter-option"><input type="checkbox" data-group="skill" value="Writing"> Escrita</label>
        <label class="filter-option"><input type="checkbox" data-group="skill" value="Listening"> Escuta</label>
      </div>
      <div class="filter-group">
        <h4 data-i18n="library.difficulty">Dificuldade</h4>
        <label class="filter-option"><input type="checkbox" data-group="difficulty" value="Beginner"> Iniciante</label>
        <label class="filter-option"><input type="checkbox" data-group="difficulty" value="Intermediate"> Intermediário</label>
        <label class="filter-option"><input type="checkbox" data-group="difficulty" value="Advanced"> Avançado</label>
      </div>
      <button class="filter-reset" id="filter-reset" data-i18n="library.reset">Limpar filtros</button>
      <button class="filter-panel-apply" id="filter-panel-apply" data-i18n="library.apply">Aplicar filtros</button>
    </aside>
    <div class="filter-overlay" id="filter-overlay"></div>

    <div>
      <div class="library-results-head">
        <span class="library-count" id="library-count">—</span>
      </div>
      <div class="game-grid" id="game-grid"></div>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-bottom">
      <span>© 2026 Mrs. Dani. All rights reserved.</span>
      <a href="../login/aluno.html" data-i18n="footer.studentAccess">Acesso do aluno →</a>
    </div>
  </div>
</footer>

<script src="../js/main.js"></script>
</body>
</html>
