<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Check-Up</title>
<meta name="description" content="A 30-question placement-test-style check-up (reading, picture reading, cloze and grammar) that shows exactly what to study next.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFF8EE;
    --surface:#FFFFFF;
    --surface-2:#FFEFDC;
    --ink:#2A2447;
    --ink-soft:#726A8F;
    --accent:#5B5FEF;
    --accent-strong:#4245C4;
    --accent-soft:#E9E9FF;
    --accent2:#FF7A55;
    --accent2-strong:#E85F38;
    --accent2-soft:#FFE7DC;
    --gold:#FFB100;
    --gold-soft:#FFF1CE;
    --good:#22B573;
    --good-soft:#E1F8EC;
    --bad:#FF5C5C;
    --bad-soft:#FFE9E9;
    --border:#F0E3CE;
    --dot-color: rgba(42,36,71,0.07);
    --shadow: 0 2px 0 rgba(42,36,71,0.05), 0 10px 24px -14px rgba(42,36,71,0.28);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#181433;
      --surface:#221C47;
      --surface-2:#2B2557;
      --ink:#F2EFFF;
      --ink-soft:#B7AEDD;
      --accent:#9296FF;
      --accent-strong:#B7BAFF;
      --accent-soft:#332D68;
      --accent2:#FF9C7F;
      --accent2-strong:#FFB89F;
      --accent2-soft:#472C25;
      --gold:#FFCC4D;
      --gold-soft:#3C2E10;
      --good:#4FE39B;
      --good-soft:#163826;
      --bad:#FF8686;
      --bad-soft:#3E2020;
      --border:#3B3469;
      --dot-color: rgba(255,255,255,0.07);
      --shadow: 0 2px 0 rgba(0,0,0,0.2), 0 10px 24px -14px rgba(0,0,0,0.55);
    }
  }
  :root[data-theme="dark"]{
    --bg:#181433;
    --surface:#221C47;
    --surface-2:#2B2557;
    --ink:#F2EFFF;
    --ink-soft:#B7AEDD;
    --accent:#9296FF;
    --accent-strong:#B7BAFF;
    --accent-soft:#332D68;
    --accent2:#FF9C7F;
    --accent2-strong:#FFB89F;
    --accent2-soft:#472C25;
    --gold:#FFCC4D;
    --gold-soft:#3C2E10;
    --good:#4FE39B;
    --good-soft:#163826;
    --bad:#FF8686;
    --bad-soft:#3E2020;
    --border:#3B3469;
    --dot-color: rgba(255,255,255,0.07);
    --shadow: 0 2px 0 rgba(0,0,0,0.2), 0 10px 24px -14px rgba(0,0,0,0.55);
  }

  *{box-sizing:border-box;}
  body{
    background-color:var(--bg);
    background-image: radial-gradient(var(--dot-color) 1.6px, transparent 1.6px);
    background-size: 22px 22px;
    color:var(--ink);
    font-family:'Nunito', system-ui, sans-serif;
    padding-inline:16px;
    padding-block:24px;
    max-width:760px;
    margin:0 auto;
    min-height:100vh;
  }
  h1,h2,h3{font-family:'Baloo 2', system-ui, sans-serif; text-wrap:balance; margin:0;}
  .eyebrow{
    display:inline-flex; align-items:center; gap:6px;
    font-size:12.5px; font-weight:800; letter-spacing:0.03em;
    color:var(--accent-strong);
    background:var(--accent-soft);
    padding:5px 12px;
    border-radius:99px;
  }
  header.top{
    display:flex; flex-direction:column; gap:10px; margin-bottom:22px;
    padding-top:4px;
  }
  header.top h1{font-size:clamp(24px,5.5vw,32px); font-weight:700; color:var(--ink);}
  header.top p{margin:0; color:var(--ink-soft); font-size:15px; line-height:1.5; max-width:52ch;}

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:20px;
    box-shadow:var(--shadow);
    padding:20px;
  }

  nav.simulados{
    display:flex; gap:12px; margin-bottom:22px;
  }
  nav.simulados button{
    --btn-color:var(--accent);
    --btn-soft:var(--accent-soft);
    flex:1;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    border:2px solid var(--border);
    background:var(--surface);
    padding:18px 12px;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:14.5px;
    line-height:1.3;
    color:var(--ink);
    border-radius:18px;
    cursor:pointer;
    box-shadow:var(--shadow);
    transition:border-color .15s, background .15s, transform .12s;
    text-align:center;
  }
  #tabPart1Btn{--btn-color:var(--accent2); --btn-soft:var(--accent2-soft);}
  nav.simulados button .icon{
    width:38px; height:38px;
    border-radius:12px;
    background:var(--btn-soft);
    display:flex; align-items:center; justify-content:center;
    color:var(--btn-color);
  }
  nav.simulados button:hover{transform:translateY(-2px); border-color:var(--btn-color);}
  nav.simulados button.active{
    border-color:var(--btn-color);
    background:var(--btn-soft);
    color:var(--btn-color);
  }
  nav.simulados button:focus-visible{outline:3px solid var(--btn-color); outline-offset:2px;}

  .back-btn{
    display:inline-flex; align-items:center; gap:6px;
    border:none; background:transparent;
    color:var(--subject, var(--accent));
    font-family:'Nunito', sans-serif;
    font-weight:800;
    font-size:14px;
    padding:8px 4px;
    margin-bottom:12px;
    cursor:pointer;
  }
  .back-btn:hover{text-decoration:underline;}
  .back-btn:focus-visible{outline:2px solid var(--subject, var(--accent)); outline-offset:2px; border-radius:6px;}

  #part1Pane{--subject:var(--accent2); --subject-strong:var(--accent2-strong); --subject-soft:var(--accent2-soft);}
  #part2Pane{--subject:var(--accent); --subject-strong:var(--accent-strong); --subject-soft:var(--accent-soft);}

  .score-row{
    display:flex; gap:10px; margin-bottom:16px;
  }
  .score-chip{
    flex:1;
    display:flex; align-items:center; justify-content:center; gap:8px;
    border-radius:14px;
    padding:10px 12px;
    font-family:'Nunito', sans-serif;
    font-weight:700;
    font-size:13.5px;
  }
  .score-chip.good{background:var(--good-soft); color:var(--good);}
  .score-chip.bad{background:var(--bad-soft); color:var(--bad);}
  .score-chip .num{
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:16px; font-variant-numeric:tabular-nums;
  }

  .passage{
    background:var(--subject-soft, var(--accent-soft));
    border:1px solid var(--border);
    border-radius:16px;
    padding:16px;
    margin-bottom:16px;
    font-size:14.5px;
    line-height:1.65;
    color:var(--ink);
  }
  .passage .ptitle{
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:17px; margin-bottom:8px; color:var(--subject-strong, var(--accent-strong));
  }
  .passage svg, .passage img{width:100%; height:auto; border-radius:10px; display:block; margin-top:6px;}

  .qcard{margin-bottom:16px;}
  .qcard .qnum{font-size:12.5px; font-weight:800; color:var(--subject-strong, var(--accent-strong)); letter-spacing:0.02em; margin-bottom:8px;}
  .qcard .qtext{font-size:17px; font-weight:700; margin-bottom:14px; line-height:1.4;}

  .options{display:flex; flex-direction:column; gap:9px;}
  .opt{
    display:flex; align-items:center; gap:12px;
    text-align:left;
    border:2px solid var(--border);
    background:var(--surface);
    color:var(--ink);
    border-radius:14px;
    padding:12px 14px;
    font-family:inherit;
    font-weight:600;
    font-size:15px;
    cursor:pointer;
    transition:border-color .12s, background .12s, transform .1s;
  }
  .opt:hover:not(:disabled){border-color:var(--subject, var(--accent)); transform:translateY(-1px);}
  .opt:active:not(:disabled){transform:translateY(0) scale(0.99);}
  .opt:focus-visible{outline:3px solid var(--subject, var(--accent)); outline-offset:2px;}
  .opt .letter{
    flex:none;
    width:28px; height:28px;
    border-radius:50%;
    background:var(--surface-2);
    display:flex; align-items:center; justify-content:center;
    font-family:'Baloo 2',sans-serif;
    font-weight:700; font-size:13.5px; color:var(--ink-soft);
  }
  .opt:disabled{cursor:default;}
  .opt.correct{border-color:var(--good); background:var(--good-soft);}
  .opt.correct .letter{background:var(--good); color:#fff;}
  .opt.wrong{border-color:var(--bad); background:var(--bad-soft);}
  .opt.wrong .letter{background:var(--bad); color:#fff;}

  .feedback{
    margin-top:10px; padding:11px 14px; border-radius:12px; font-size:14px; font-weight:600; line-height:1.5;
    display:none;
  }
  .feedback.show{display:block;}
  .feedback.good{background:var(--good-soft); color:var(--good);}
  .feedback.bad{background:var(--bad-soft); color:var(--bad);}
  .feedback b{color:inherit;}

  .next-row{margin-top:14px; display:flex; justify-content:flex-end;}
  button.primary{
    background:var(--subject, var(--accent)); color:#fff; border:none; border-radius:12px;
    padding:11px 20px; font-family:'Baloo 2',sans-serif; font-weight:700; font-size:15px; cursor:pointer;
    box-shadow:0 3px 0 rgba(0,0,0,0.12);
    transition:transform .1s, box-shadow .1s;
  }
  button.primary:hover{filter:brightness(1.05); transform:translateY(-1px);}
  button.primary:active{transform:translateY(1px); box-shadow:0 1px 0 rgba(0,0,0,0.12);}
  button.primary:disabled{opacity:.4; cursor:default; transform:none; box-shadow:none;}

  .result{
    text-align:center; padding:8px 0 4px;
  }
  .stars{
    display:flex; justify-content:center; gap:6px; margin:6px 0 16px;
  }
  .stars svg{width:38px; height:38px;}
  .result h3{font-size:21px; margin-bottom:4px; font-family:'Baloo 2',sans-serif;}
  .result p{color:var(--ink-soft); font-size:14.5px; font-weight:600; margin:0 0 16px;}
  .pass-badge{
    display:inline-block; padding:6px 16px; border-radius:99px; font-weight:800; font-size:13.5px; margin-bottom:14px;
  }
  .pass-badge.pass{background:var(--good-soft); color:var(--good);}
  .pass-badge.fail{background:var(--gold-soft); color:var(--gold);}

  .review-title{
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:15px; margin:18px 0 10px; text-align:left; color:var(--ink);
  }
  .review-list{display:flex; flex-direction:column; gap:8px; text-align:left; margin-bottom:18px;}
  .review-item{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    background:var(--surface-2); border-radius:10px; padding:10px 13px;
    font-size:13.5px; font-weight:700; color:var(--ink);
  }
  .review-item .frac{
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:12.5px; color:var(--bad); font-variant-numeric:tabular-nums;
  }
  .review-empty{
    font-size:13.5px; font-weight:700; color:var(--good); text-align:left; margin-bottom:18px;
  }

  .result-actions{display:flex; gap:10px; justify-content:center; flex-wrap:wrap;}

  footer.hint{
    margin-top:22px; text-align:center; font-size:13px; color:var(--ink-soft);
  }
</style>
</head>
<body>

<header class="top">
  <h1>English Check-Up</h1>
  <p>Choose what to check first. Answer, see the explanation right away, and get a clear picture of what to study next.</p>
</header>

<nav class="simulados">
  <button id="tabPart1Btn">
    <span class="icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 6.5c-1.6-1.3-4-2-6.5-2v12.5c2.5 0 4.9.7 6.5 2 1.6-1.3 4-2 6.5-2V4.5c-2.5 0-4.9.7-6.5 2z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 6.5v12.5" stroke="currentColor" stroke-width="1.8"/></svg></span>
    <span>Part 1: Reading &amp; Comprehension</span>
  </button>
  <button id="tabPart2Btn">
    <span class="icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 20l1.2-4.2L15.6 5.4a1.5 1.5 0 0 1 2.1 0l1 1a1.5 1.5 0 0 1 0 2.1L8.3 18.8 4 20z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M13.8 7.2l3 3" stroke="currentColor" stroke-width="1.8"/></svg></span>
    <span>Part 2: Language Use &amp; Structure</span>
  </button>
</nav>

<div id="part1Pane" hidden>
  <button type="button" class="back-btn" id="backFromPart1">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Back to menu
  </button>
  <div id="part1Section"></div>
</div>

<div id="part2Pane" hidden>
  <button type="button" class="back-btn" id="backFromPart2">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Back to menu
  </button>
  <div id="part2Section"></div>
</div>

<footer class="hint">Tip: this follows the same structure as the school's placement test — 30 questions, numbered from 1 to 30, with an answer key at the end of each part.</footer>

<script>
(function(){
  "use strict";

  /* ===================== PART 1 — READING AND COMPREHENSION (Q1-15) ===================== */

  var part1Passages = [
    {
      title:"Section A · How to Grow a Sunflower",
      text:"Growing a sunflower is easy and fun! First, put some soil in a small pot. Next, make a hole about two centimeters deep and drop one sunflower seed inside. Cover the seed with soil and water it gently. Place the pot near a sunny window, because sunflowers need a lot of light to grow tall. Water the plant every two or three days, but don't add too much water. After about two weeks, a small green sprout will appear. In a few months, your sunflower can grow as tall as an adult! Some sunflowers even grow taller than a house. Be patient, and soon you will have your own beautiful flower.",
      questions:[
        {number:1, q:"What is this text mainly about?", opts:["How sunflowers are sold in stores","How to grow a sunflower step by step","The history of sunflowers","Different types of flowers"], a:1,
          exp:"The text gives step-by-step instructions for growing a sunflower.", topic:"Main Idea"},
        {number:2, q:"According to the text, how deep should the hole be?", opts:["About two centimeters","About two meters","About ten centimeters","The text doesn't say"], a:0,
          exp:"The text says: 'make a hole about two centimeters deep'.", topic:"Finding Details"},
        {number:3, q:"What should you do right after making the hole?", opts:["Water the plant every day","Put the pot near a window","Drop a sunflower seed inside","Wait two weeks"], a:2,
          exp:"The order of steps is: make the hole, then drop the seed inside.", topic:"Sequence of Actions"},
        {number:4, q:"In the text, the word 'sprout' most likely means...", opts:["a dry leaf","a small new plant beginning to grow","a type of flower pot","a garden tool"], a:1,
          exp:"A 'sprout' is the first small green growth that appears when a seed starts to grow.", topic:"Vocabulary in Context"},
        {number:5, q:"Why does the pot need to be near a sunny window?", opts:["Because it looks nice there","Because sunflowers need a lot of light to grow","Because the soil dries faster there","Because it's easier to water there"], a:1,
          exp:"The text says sunflowers 'need a lot of light to grow tall'.", topic:"Relating Details"}
      ]
    },
    {
      title:"Section B · The Class Trip to the Zoo",
      text:"Last Friday, Ms. Parker's class went on a trip to the city zoo. The students were very excited because they love animals. When they arrived, they saw lions, giraffes, and colorful parrots. Near the elephant area, a boy named Leo dropped his hat on the ground. A curious monkey climbed down from a tree, grabbed the hat, and put it on its own head! Everyone laughed, and Leo laughed too. Later, the class watched the zookeepers feed the elephants fresh fruit and vegetables. Before leaving, the students visited the gift shop and bought small animal toys to remember their special day. Leo decided his favorite animal was the monkey, because it made him laugh so much.",
      questions:[
        {number:6, q:"Where did Ms. Parker's class go on their trip?", opts:["To the beach","To the city zoo","To a farm","To a museum"], a:1,
          exp:"The text says the class 'went on a trip to the city zoo'.", topic:"Characters, Places & Facts"},
        {number:7, q:"Why did everyone laugh?", opts:["Because Leo told a joke","Because a monkey put Leo's hat on its own head","Because the elephants danced","Because Ms. Parker fell down"], a:1,
          exp:"The monkey grabbed Leo's hat and put it on its own head, which made everyone laugh.", topic:"Cause and Effect"},
        {number:8, q:"What did the zookeepers give the elephants?", opts:["Fresh fruit and vegetables","Small animal toys","Colorful hats","Water only"], a:0,
          exp:"The text says the zookeepers fed the elephants 'fresh fruit and vegetables'.", topic:"Finding Details"},
        {number:9, q:"In the text, the word 'curious' is closest in meaning to...", opts:["angry","tired","interested and wanting to know more","hungry"], a:2,
          exp:"A 'curious' animal or person wants to explore and find out about things.", topic:"Vocabulary in Context"},
        {number:10, q:"Why did Leo say the monkey was his favorite animal?", opts:["Because it was the biggest animal at the zoo","Because it made him laugh so much","Because it was in the gift shop","Because it ate the most food"], a:1,
          exp:"The last sentence says the monkey 'made him laugh so much'.", topic:"Making Inferences"}
      ]
    },
    {
      title:"Section C · Picture Reading — At the Park",
      text:"<img src=\"imagem_checkup.jpeg\" alt=\"A park scene: a cat sleeping under a tree, a boy reading on a bench with his backpack on the ground, a girl holding a kite next to a dog, and two children playing with a ball between them.\">",
      questions:[
        {number:11, q:"What is the boy on the bench doing?", opts:["Riding a bicycle","Reading a book","Playing with a ball","Flying a kite"], a:1,
          exp:"In the picture, the boy sitting on the bench is reading a book.", topic:"Identifying Actions"},
        {number:12, q:"Where is the cat in the picture?", opts:["On the bench","Under the tree","Next to the dog","Behind the girl on the bicycle"], a:1,
          exp:"The cat is sleeping under the tree.", topic:"Prepositions of Place"},
        {number:13, q:"The dog is sitting next to the girl holding the kite. True or False?", opts:["True","False"], a:0,
          exp:"In the picture, the dog is right next to the girl with the kite.", topic:"Comparing Visual Information"},
        {number:14, q:"The backpack is on top of the bench. True or False?", opts:["True","False"], a:1,
          exp:"The backpack is on the ground near the bench, not on top of it.", topic:"Comparing Visual Information"},
        {number:15, q:"Two children are playing with a ball between them. True or False?", opts:["True","False"], a:0,
          exp:"In the picture, two children are playing together, with the ball between them.", topic:"Comparing Visual Information"}
      ]
    }
  ];

  var part1Items = [];
  part1Passages.forEach(function(p, pi){
    p.questions.forEach(function(item, qi){
      part1Items.push({number:item.number, q:item.q, opts:item.opts, a:item.a, exp:item.exp, topic:item.topic, passageIndex:pi});
    });
  });

  /* ===================== PART 2 — LANGUAGE USE AND STRUCTURE (Q16-30) ===================== */

  var part2Passages = [
    {
      title:"Section D · Vocabulary Cloze — Mia's Morning",
      text:"My name is Mia. I live with my <b>(1)</b>___ in a small house near the woods. Every morning, I wear a red <b>(2)</b>___ and my favorite shoes before going to school. On the way, I like looking at the tall <b>(3)</b>___ and the blue sky. My dog, Max, has big brown <b>(4)</b>___ and a short tail. He is very <b>(5)</b>___, and he always makes us smile.",
      questions:[
        {number:16, q:"Choose the best word for gap (1).", opts:["family","backpack","river","hungry"], a:0,
          exp:"'Family' fits gap (1): 'I live with my family...'.", topic:"Vocabulary Cloze"},
        {number:17, q:"Choose the best word for gap (2).", opts:["backpack","river","jacket","hungry"], a:2,
          exp:"'Jacket' fits gap (2): a piece of clothing you wear in the morning.", topic:"Vocabulary Cloze"},
        {number:18, q:"Choose the best word for gap (3).", opts:["trees","family","eyes","funny"], a:0,
          exp:"'Trees' fits gap (3): something tall you see on the way to school.", topic:"Vocabulary Cloze"},
        {number:19, q:"Choose the best word for gap (4).", opts:["backpack","eyes","river","hungry"], a:1,
          exp:"'Eyes' fits gap (4): a body part — 'big brown eyes'.", topic:"Vocabulary Cloze"},
        {number:20, q:"Choose the best word for gap (5).", opts:["funny","jacket","trees","hungry"], a:0,
          exp:"'Funny' fits gap (5): an adjective describing a dog who makes people smile.", topic:"Vocabulary Cloze"}
      ]
    }
  ];

  var grammarE = [
    {number:21, q:"Tom and Ana are my cousins. ________ live in Rio.", opts:["He","She","They","It"], a:2,
      exp:"'They' is the subject pronoun that replaces a plural noun (Tom and Ana).", topic:"Pronouns"},
    {number:22, q:"________ you tired? – No, I'm not.", opts:["Do","Is","Are","Does"], a:2,
      exp:"We use 'Are' to ask a yes/no question with 'you' in the verb to be.", topic:"Verb to be"},
    {number:23, q:"________ your brother like football?", opts:["Do","Does","Is","Are"], a:1,
      exp:"'Brother' is 3rd person singular, so the question uses 'Does'.", topic:"Present Simple"},
    {number:24, q:"Look! The children ________ in the pool right now.", opts:["swim","swims","are swimming","swimming"], a:2,
      exp:"'Right now' signals the Present Continuous: are + verb-ing.", topic:"Present Continuous"},
    {number:25, q:"________ do you brush your teeth? – Twice a day.", opts:["When","How often","Why","What"], a:1,
      exp:"'How often' asks about frequency, matching the answer 'Twice a day'.", topic:"Wh- Questions"},
    {number:26, q:"My birthday is ________ July.", opts:["in","on","at","of"], a:0,
      exp:"We use 'in' with months: in July.", topic:"Prepositions of Time"},
    {number:27, q:"________ any apples in the fridge?", opts:["Is there","Are there","There is","There are"], a:1,
      exp:"'Apples' is plural, so the question is 'Are there...?'.", topic:"There is / There are"},
    {number:28, q:"How ________ water do you drink every day?", opts:["much","many","some","any"], a:0,
      exp:"'Water' is uncountable, so we use 'much' in the question.", topic:"Quantifiers"},
    {number:29, q:"________ bike is this? – It's Marcos's.", opts:["Who","Whose","Which","What"], a:1,
      exp:"'Whose' asks about possession — who something belongs to.", topic:"Possessives"},
    {number:30, q:"A: Hi, I'm Laura. ________ B: I'm Marco. Nice to meet you!", opts:["What's your name?","How much is it?","Where are you from?","What time is it?"], a:0,
      exp:"When you introduce yourself, a natural reply is to ask 'What's your name?'.", topic:"Functional Language"}
  ];

  var part2Items = [];
  part2Passages.forEach(function(p, pi){
    p.questions.forEach(function(item, qi){
      part2Items.push({number:item.number, q:item.q, opts:item.opts, a:item.a, exp:item.exp, topic:item.topic, passageIndex:pi});
    });
  });
  grammarE.forEach(function(item){
    part2Items.push({number:item.number, q:item.q, opts:item.opts, a:item.a, exp:item.exp, topic:item.topic});
  });

  /* ===================== ENGINE ===================== */

  function letterFor(opts, idx){
    var set = opts.length === 2 ? ['T','F'] : ['A','B','C','D'];
    return set[idx];
  }

  function buildSection(containerId, itemsProvider, sectionLabel, passagesForSection){
    var container = document.getElementById(containerId);
    var items, state;

    function reset(){
      items = itemsProvider();
      state = {current:0, answered:new Array(items.length).fill(false), correct:new Array(items.length).fill(false), rightCount:0, wrongCount:0};
    }

    function render(){
      if(state.current >= items.length){ renderResult(); return; }
      var item = items[state.current];

      var html = '';
      html += '<div class="score-row">' +
              '<div class="score-chip good">Correct <span class="num" id="rightNum_'+containerId+'">'+state.rightCount+'</span></div>' +
              '<div class="score-chip bad">Wrong <span class="num" id="wrongNum_'+containerId+'">'+state.wrongCount+'</span></div>' +
              '</div>';

      if(passagesForSection && item.passageIndex !== undefined){
        var p = passagesForSection[item.passageIndex];
        html += '<div class="passage"><div class="ptitle">'+p.title+'</div>'+p.text+'</div>';
      }

      html += '<div class="card qcard">';
      html += '<div class="qnum">'+sectionLabel+' · Question '+item.number+' of 30</div>';
      html += '<div class="qtext">'+item.q+'</div>';
      html += '<div class="options" id="opts_'+containerId+'"></div>';
      html += '<div class="feedback" id="fb_'+containerId+'"></div>';
      html += '<div class="next-row"><button class="primary" id="next_'+containerId+'" disabled>Next</button></div>';
      html += '</div>';

      container.innerHTML = html;

      var optsWrap = document.getElementById('opts_'+containerId);
      item.opts.forEach(function(optText, idx){
        var btn = document.createElement('button');
        btn.className = 'opt';
        btn.type = 'button';
        btn.innerHTML = '<span class="letter">'+letterFor(item.opts, idx)+'</span><span>'+optText+'</span>';
        btn.addEventListener('click', function(){ selectAnswer(idx); });
        optsWrap.appendChild(btn);
      });

      var nextBtn = document.getElementById('next_'+containerId);
      nextBtn.addEventListener('click', function(){
        state.current++;
        render();
      });

      function selectAnswer(idx){
        if(state.answered[state.current]) return;
        state.answered[state.current] = true;
        var isCorrect = (idx === item.a);
        state.correct[state.current] = isCorrect;

        if(isCorrect){
          state.rightCount++;
          document.getElementById('rightNum_'+containerId).textContent = state.rightCount;
        } else {
          state.wrongCount++;
          document.getElementById('wrongNum_'+containerId).textContent = state.wrongCount;
        }

        var optButtons = optsWrap.querySelectorAll('.opt');
        optButtons.forEach(function(b, i){
          b.disabled = true;
          if(i === item.a) b.classList.add('correct');
          if(i === idx && !isCorrect) b.classList.add('wrong');
        });

        var fb = document.getElementById('fb_'+containerId);
        fb.classList.add('show');
        fb.classList.add(isCorrect ? 'good' : 'bad');
        fb.innerHTML = (isCorrect ? '<b>Nice! That\'s correct.</b> ' : '<b>Almost!</b> ') + item.exp;

        nextBtn.disabled = false;
        if(state.current === items.length - 1){ nextBtn.textContent = 'See Results'; }
      }
    }

    function renderResult(){
      var score = state.rightCount;
      var total = items.length;
      var pct = Math.round(score/total*100);
      var passed = pct >= 60;
      var starCount = pct >= 90 ? 3 : (pct >= 75 ? 2 : (pct >= 60 ? 1 : 0));

      function star(filled){
        var color = filled ? 'var(--gold)' : 'var(--surface-2)';
        return '<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.5 1.3 6.6L12 17.6l-5.9 2.9 1.3-6.6-4.9-4.5 6.6-.8z" fill="'+color+'"/></svg>';
      }
      var starsHtml = '';
      for(var s=0; s<3; s++){ starsHtml += star(s < starCount); }

      var message = passed
        ? 'Great job! You did really well in this part.'
        : 'Almost there! How about practicing a bit more?';

      // Group results by topic to see what needs more practice.
      var topicStats = {};
      items.forEach(function(it, idx){
        var t = it.topic || 'General';
        if(!topicStats[t]) topicStats[t] = {right:0, total:0};
        topicStats[t].total++;
        if(state.correct[idx]) topicStats[t].right++;
      });
      var weakTopics = Object.keys(topicStats).map(function(t){
        return {topic:t, right:topicStats[t].right, total:topicStats[t].total};
      }).filter(function(t){ return t.right < t.total; })
        .sort(function(a,b){ return (a.right/a.total) - (b.right/b.total); });

      var reviewHtml = '<div class="review-title">Where to study more</div>';
      if(weakTopics.length){
        reviewHtml += '<div class="review-list">';
        weakTopics.forEach(function(t){
          reviewHtml += '<div class="review-item"><span>'+t.topic+'</span><span class="frac">'+t.right+'/'+t.total+'</span></div>';
        });
        reviewHtml += '</div>';
      } else {
        reviewHtml += '<div class="review-empty">Awesome — every topic was 100% correct this time!</div>';
      }

      var html = '<div class="card result">';
      html += '<div class="eyebrow">'+sectionLabel+' · Results</div>';
      html += '<div class="stars">'+starsHtml+'</div>';
      html += '<h3>'+score+' out of '+total+' correct ('+pct+'%)</h3>';
      html += '<p>'+message+'</p>';
      html += '<div class="pass-badge '+(passed?'pass':'fail')+'">'+(passed ? 'You did great!' : 'Let\'s practice a bit more')+'</div>';
      html += reviewHtml;
      html += '<div class="result-actions">';
      html += '<button class="primary" id="retry_'+containerId+'">Practice Again</button>';
      html += '</div></div>';

      container.innerHTML = html;
      document.getElementById('retry_'+containerId).addEventListener('click', function(){
        reset();
        render();
      });
    }

    reset();
    render();
  }

  buildSection('part1Section', function(){ return part1Items; }, 'Part 1', part1Passages);
  buildSection('part2Section', function(){ return part2Items; }, 'Part 2', part2Passages);

  var tab1 = document.getElementById('tabPart1Btn');
  var tab2 = document.getElementById('tabPart2Btn');
  var pane1 = document.getElementById('part1Pane');
  var pane2 = document.getElementById('part2Pane');
  var menu = document.querySelector('nav.simulados');
  var back1 = document.getElementById('backFromPart1');
  var back2 = document.getElementById('backFromPart2');

  function showMenu(){
    menu.hidden = false;
    pane1.hidden = true;
    pane2.hidden = true;
    tab1.classList.remove('active');
    tab2.classList.remove('active');
  }

  tab1.addEventListener('click', function(){
    tab1.classList.add('active'); tab2.classList.remove('active');
    menu.hidden = true;
    pane1.hidden = false; pane2.hidden = true;
  });
  tab2.addEventListener('click', function(){
    tab2.classList.add('active'); tab1.classList.remove('active');
    menu.hidden = true;
    pane2.hidden = false; pane1.hidden = true;
  });
  back1.addEventListener('click', showMenu);
  back2.addEventListener('click', showMenu);
})();
</script>
</body>
</html>
