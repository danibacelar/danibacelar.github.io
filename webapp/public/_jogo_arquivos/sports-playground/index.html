<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sports Playground — English Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#2FA9D6;
    --sky-dark:#1C7FA8;
    --grass:#4CB963;
    --sun:#FFC93C;
    --coral:#FF6B6B;
    --plum:#8E5FD9;
    --navy:#1B3A5C;
    --bg:#EAF6FB;
    --card:#FFFFFF;
    --ink:#1B3A5C;
    --radius:22px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 8% 6%, #d7f0ff 0%, transparent 40%),
      radial-gradient(circle at 92% 12%, #fff2cf 0%, transparent 38%),
      radial-gradient(circle at 85% 90%, #e3f9e6 0%, transparent 40%),
      var(--bg);
    font-family:'Nunito', sans-serif;
    color:var(--ink);
    min-height:100vh;
    padding:18px;
  }
  .wrap{max-width:760px;margin:0 auto;}
  h1,h2,h3{font-family:'Fredoka',sans-serif;margin:0;}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:18px;flex-wrap:wrap;gap:10px;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .logo{font-size:34px;}
  .brand h1{font-size:24px;color:var(--sky-dark);letter-spacing:.5px;}
  .brand span{display:block;font-size:12px;font-weight:700;color:var(--plum);letter-spacing:1px;text-transform:uppercase;}
  .backbtn{
    background:var(--card);border:3px solid var(--navy);border-radius:100px;
    padding:9px 18px;font-family:'Fredoka';font-weight:600;font-size:14px;
    cursor:pointer;color:var(--navy);box-shadow:0 4px 0 var(--navy);
  }
  .backbtn:active{transform:translateY(3px);box-shadow:none;}

  /* MENU */
  .menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media (max-width:560px){.menu-grid{grid-template-columns:1fr;}}
  .game-card{
    background:var(--card);border-radius:var(--radius);padding:20px 18px;
    cursor:pointer;position:relative;overflow:hidden;
    border-bottom:6px solid var(--c,var(--sky));
    box-shadow:0 6px 18px rgba(27,58,92,.10);
    transition:transform .15s ease;
  }
  .game-card:hover{transform:translateY(-4px);}
  .game-card .emoji{font-size:44px;display:block;margin-bottom:8px;}
  .game-card h2{font-size:19px;color:var(--navy);margin-bottom:6px;}
  .game-card p{font-size:13.5px;margin:0;line-height:1.4;color:#4a5c72;font-weight:700;}
  .game-card .tag{
    position:absolute;top:14px;right:14px;background:var(--c,var(--sky));
    color:#fff;font-family:'Fredoka';font-size:12px;font-weight:600;
    padding:3px 10px;border-radius:100px;
  }
  .menu-intro{
    background:var(--card);border-radius:var(--radius);padding:16px 20px;margin-bottom:18px;
    box-shadow:0 6px 18px rgba(27,58,92,.10);font-weight:700;font-size:14.5px;color:#4a5c72;
  }
  .menu-intro b{color:var(--sky-dark);}

  /* GAME CARD PANEL */
  .panel{
    background:var(--card);border-radius:var(--radius);padding:20px;
    box-shadow:0 6px 20px rgba(27,58,92,.12);
  }
  .progress-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
  .progress-bar-outer{flex:1;min-width:120px;height:12px;background:#e5eef4;border-radius:100px;overflow:hidden;margin:0 10px;}
  .progress-bar-inner{height:100%;background:linear-gradient(90deg,var(--sun),var(--coral));border-radius:100px;transition:width .3s ease;}
  .score-pill{
    background:var(--navy);color:#fff;font-family:'Fredoka';font-weight:600;
    font-size:13px;padding:6px 14px;border-radius:100px;white-space:nowrap;
  }

  .stage-title{font-size:16px;font-weight:800;margin-bottom:12px;color:var(--navy);text-align:center;}
  .stage-title small{display:block;font-size:12px;font-weight:700;color:var(--plum);margin-top:2px;}

  /* IMAGE + CIRCLE */
  .img-frame{
    position:relative;width:100%;border-radius:16px;overflow:hidden;
    box-shadow:0 4px 14px rgba(0,0,0,.15);margin-bottom:16px;background:#000;
  }
  .img-frame img{display:block;width:100%;height:auto;}
  .spot-star{
    position:absolute;font-size:38px;transform:translateX(-50%);
    filter:drop-shadow(0 3px 5px rgba(0,0,0,.45));
    animation:starbounce 1s ease-in-out infinite;pointer-events:none;
  }
  @keyframes starbounce{
    0%,100%{transform:translateX(-50%) translateY(0) rotate(-6deg);}
    50%{transform:translateX(-50%) translateY(-7px) rotate(6deg);}
  }
  .feel-badge{
    position:absolute;font-size:34px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35));
    animation:float 2s ease-in-out infinite;
  }
  @keyframes float{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-6px);}
  }

  /* OPTIONS / BUTTONS */
  .options-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media (max-width:480px){.options-grid{grid-template-columns:1fr;}}
  .opt-btn{
    font-family:'Fredoka';font-weight:600;font-size:15px;
    background:#fff;border:3px solid var(--sky);color:var(--sky-dark);
    border-radius:16px;padding:14px 10px;cursor:pointer;
    box-shadow:0 4px 0 var(--sky);transition:transform .08s;
  }
  .opt-btn:active{transform:translateY(3px);box-shadow:none;}
  .opt-btn.correct{background:var(--grass);border-color:#379149;color:#fff;box-shadow:0 4px 0 #379149;}
  .opt-btn.wrong{background:var(--coral);border-color:#c94848;color:#fff;box-shadow:0 4px 0 #c94848;animation:shake .35s;}
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-6px);}
    75%{transform:translateX(6px);}
  }

  .question-text{font-size:16px;font-weight:800;text-align:center;margin-bottom:14px;color:var(--navy);}

  /* SENTENCE BUILDER */
  .answer-strip{
    min-height:52px;background:#f2f8fb;border:3px dashed #bcdcec;border-radius:16px;
    display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;margin-bottom:14px;
  }
  .answer-strip .placeholder{color:#9db3c4;font-weight:700;font-size:13px;}
  .word-chip-slot{
    font-family:'Fredoka';font-weight:600;background:var(--sky);color:#fff;
    padding:8px 14px;border-radius:10px;font-size:15px;
  }
  .chip-pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;}
  .word-chip{
    font-family:'Fredoka';font-weight:600;font-size:15px;
    background:#fff;border:3px solid var(--plum);color:var(--plum);
    border-radius:12px;padding:9px 16px;cursor:pointer;box-shadow:0 4px 0 var(--plum);
  }
  .word-chip:active{transform:translateY(3px);box-shadow:none;}
  .word-chip.used{opacity:0;pointer-events:none;}
  .word-chip.wrongpick{animation:shake .35s;}

  /* MATCHING PUZZLE (Game 4A) */
  .match-cols{display:flex;gap:16px;}
  .match-col{flex:1;display:flex;flex-direction:column;gap:10px;}
  .puzzle-piece{
    font-family:'Fredoka';font-weight:600;font-size:15px;text-align:center;
    padding:12px 8px;border-radius:14px;cursor:pointer;border:3px solid var(--sun);
    background:#fff8e6;color:#8a6d00;box-shadow:0 4px 0 #e0b52e;transition:transform .08s;
  }
  .puzzle-piece.right-col{border-color:var(--sky);background:#eaf6fb;color:var(--sky-dark);box-shadow:0 4px 0 var(--sky);}
  .puzzle-piece:active{transform:translateY(3px);box-shadow:none;}
  .puzzle-piece.selected{outline:3px solid var(--navy);}
  .puzzle-piece.matched{background:var(--grass);color:#fff;border-color:#379149;box-shadow:0 4px 0 #379149;cursor:default;opacity:.85;}
  .puzzle-piece.wrongpick{animation:shake .35s;}

  /* FEEDBACK TOAST */
  .feedback{
    position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);
    background:var(--navy);color:#fff;padding:14px 22px;border-radius:100px;
    display:flex;align-items:center;gap:10px;font-family:'Fredoka';font-weight:600;font-size:16px;
    box-shadow:0 10px 24px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:all .25s ease;z-index:50;
  }
  .feedback.show{opacity:1;transform:translate(-50%,0);}
  .feedback.correct{background:var(--grass);}
  .feedback.wrong{background:var(--coral);}
  .feedback .fe{font-size:26px;}

  /* END SCREEN */
  .end-screen{text-align:center;padding:20px 10px;}
  .end-screen .big-emoji{font-size:70px;display:block;margin-bottom:10px;}
  .end-screen h2{font-size:22px;color:var(--navy);margin-bottom:6px;}
  .end-screen p{font-weight:700;color:#4a5c72;margin-bottom:18px;}
  .btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  .primary-btn{
    font-family:'Fredoka';font-weight:600;font-size:15px;background:var(--coral);color:#fff;
    border:none;border-radius:100px;padding:12px 24px;cursor:pointer;box-shadow:0 4px 0 #c94848;
  }
  .primary-btn:active{transform:translateY(3px);box-shadow:none;}
  .ghost-btn{
    font-family:'Fredoka';font-weight:600;font-size:15px;background:#fff;color:var(--navy);
    border:3px solid var(--navy);border-radius:100px;padding:9px 22px;cursor:pointer;box-shadow:0 4px 0 var(--navy);
  }
  .ghost-btn:active{transform:translateY(3px);box-shadow:none;}

  .subtabs{display:flex;gap:10px;margin-bottom:16px;justify-content:center;flex-wrap:wrap;}
  .subtab-btn{
    font-family:'Fredoka';font-weight:600;font-size:13.5px;background:#fff;border:3px solid var(--plum);
    color:var(--plum);border-radius:100px;padding:9px 18px;cursor:pointer;box-shadow:0 4px 0 var(--plum);
  }
  .subtab-btn.active{background:var(--plum);color:#fff;}
  .subtab-btn:active{transform:translateY(3px);box-shadow:none;}

  /* NOTEBOOK PAGE (Game 5) */
  .notebook-title{
    display:flex;align-items:center;gap:8px;margin-bottom:10px;font-family:'Fredoka';font-weight:600;
    font-size:16px;color:var(--navy);
  }
  .notebook-title .num-circle{
    width:24px;height:24px;border-radius:50%;border:2.5px solid var(--coral);color:var(--coral);
    display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;
  }
  .notebook-page{
    background:
      linear-gradient(90deg, transparent 0 28px, #f3c9c9 28px 30px, transparent 30px),
      repeating-linear-gradient(#fbfdff, #fbfdff 33px, #cfe3f5 34px);
    border-radius:12px;padding:14px 16px 14px 40px;margin-bottom:16px;
    box-shadow:0 3px 10px rgba(27,58,92,.12);
    font-family:'Caveat', cursive;font-size:23px;line-height:34px;color:#2b3f56;
    min-height:104px;
  }
  .notebook-page .placeholder{color:#a9bccd;font-family:'Nunito';font-size:13px;font-weight:700;}
  .sentence-pool{display:flex;flex-direction:column;gap:10px;}
  .sentence-chip{
    font-family:'Nunito';font-weight:800;font-size:14.5px;text-align:left;
    background:#fff;border:3px solid var(--plum);color:var(--plum);
    border-radius:14px;padding:12px 16px;cursor:pointer;box-shadow:0 4px 0 var(--plum);
    transition:transform .08s;
  }
  .sentence-chip:active{transform:translateY(3px);box-shadow:none;}
  .sentence-chip.used{opacity:0;pointer-events:none;height:0;padding:0;margin:0;border:0;overflow:hidden;}
  .sentence-chip.wrongpick{animation:shake .35s;}

  footer{text-align:center;font-size:11.5px;color:#7d93a8;font-weight:700;margin-top:24px;padding-bottom:10px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <span class="logo">🏆</span>
      <div>
        <h1>Sports Playground</h1>
        <span>English Games</span>
      </div>
    </div>
    <button class="backbtn" id="menuBtn" style="display:none;">⬅ Menu</button>
  </div>
  <div id="app"></div>
  <footer>Made with 💙 to practice sports English</footer>
</div>

<div class="feedback" id="feedback">
  <span class="fe" id="feedbackEmoji">🎉</span>
  <span id="feedbackMsg">Great job!</span>
</div>

function showFeedback(ok){
  const el = document.getElementById('feedback');

  const msgEl = document.getElementById('feedbackMsg');
  let pick, pool, lastRef;
  if(ok){ pool = PRAISE; lastRef = 'lastPraise'; } else { pool = WRONG; lastRef = 'lastWrong'; }
  let idx;
  do{ idx = Math.floor(Math.random()*pool.length); } while(pool.length>1 && idx === (ok?lastPraise:lastWrong));
  if(ok) lastPraise = idx; else lastWrong = idx;
  pick = pool[idx];
  feEl.textContent = pick.emoji;
  msgEl.textContent = pick.msg;
  el.className = 'feedback show ' + (ok?'correct':'wrong');
  clearTimeout(window._fbTimer);
  window._fbTimer = setTimeout(()=>{ el.className = 'feedback ' + (ok?'correct':'wrong'); }, 1100);
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function pickDistractors(pool, correct, count){
  const others = pool.filter(x => !correct.includes(x));
  return shuffle(others).slice(0,count);
}

/* ======================= GAME 1: Identify the sport ======================= */
let g1_order = [], g1_idx = 0, g1_score = 0;

function startGame1(){
  menuBtn.style.display = 'inline-block';
  g1_order = shuffle(SPORTS);
  g1_idx = 0; g1_score = 0;
  renderGame1Round();
}
function renderGame1Round(){
  if(g1_idx >= g1_order.length){
    app.innerHTML = endScreenHTML(g1_score, g1_order.length, 'startGame1', '🏆', 'You finished Game 1!', 'You got');
    return;
  }
  const sport = g1_order[g1_idx];
  const distractors = pickDistractors(SPORTS.map(s=>s.name), [sport.name], 3);
  const options = shuffle([sport.name, ...distractors]);
  app.innerHTML = `
    ${progressRow(g1_idx+1, g1_order.length, g1_score)}
    <div class="panel">
      <div class="stage-title">What sport is this? <small>Click the correct name in English</small></div>
      ${imgFrameHTML(sport)}
      <div class="options-grid">
        ${options.map(o => `<button class="opt-btn" data-name="${o}" onclick="g1_answer(this,'${o}','${sport.name}')">${o}</button>`).join('')}
      </div>
    </div>`;
}
function g1_answer(btn, chosen, correct){
  if(chosen === correct){
    btn.classList.add('correct');
    showFeedback(true);
    g1_score++;
    document.querySelectorAll('.opt-btn').forEach(b=>b.onclick=null);
    setTimeout(()=>{ g1_idx++; renderGame1Round(); }, 950);
  } else {
    btn.classList.add('wrong');
    showFeedback(false);
    setTimeout(()=>btn.classList.remove('wrong'), 400);
  }
}

/* ======================= GAME 2: Equipment & Location ======================= */
let g2_questions = [], g2_idx = 0, g2_score = 0;

function buildGame2Questions(){
  const locQs = [];
  const equipQs = [];
  shuffle(SPORTS).forEach(sport=>{
    locQs.push({type:'loc', sport, correct:[sport.loc]});
  });
  shuffle(SPORTS).forEach(sport=>{
    if(sport.equip.length){
      equipQs.push({type:'equip', sport, correct: sport.equip});
    }
  });
  return [...locQs, ...equipQs];
}
function sportQuestionText(type, sport){
  if(sport.id === 'swimming'){
    return type === 'equip' ? 'What do you use to swim?' : 'Where do you swim?';
  }
  if(sport.id === 'running'){
    return 'Where do you run?';
  }
  return type === 'equip'
    ? `What do you use to play <u>${sport.name}</u>?`
    : `Where do you play <u>${sport.name}</u>?`;
}
function startGame2Menu(){
  menuBtn.style.display = 'inline-block';
  app.innerHTML = `
    <div class="panel">
      <div class="stage-title">Game 2 <small>Choose an activity</small></div>
      <div class="menu-grid" style="margin-top:6px;">
        <div class="game-card" style="--c:var(--grass)" onclick="startGame2A()">
          <span class="emoji">🎒</span>
          <h2>What & Where Quiz</h2>
          <p>Find out what you use and where you play each sport.</p>
        </div>
        <div class="game-card" style="--c:var(--sky)" onclick="startGame2B()">
          <span class="emoji">🧩</span>
          <h2>Build the sentence</h2>
          <p>Unscramble sentences like "I play tennis on a court."</p>
        </div>
      </div>
    </div>`;
}
function startGame2A(){
  menuBtn.style.display = 'inline-block';
  g2_questions = buildGame2Questions();
  g2_idx = 0; g2_score = 0;
  renderGame2Round();
}
function renderGame2Round(){
  if(g2_idx >= g2_questions.length){
    app.innerHTML = `
      <div class="panel">${endScreenHTML(g2_score, g2_questions.length, 'startGame2A', '🎒', 'You finished the quiz!', 'You got')}</div>
      <div style="text-align:center;margin-top:10px;"><button class="ghost-btn" onclick="startGame2Menu()">⬅ More Game 2 activities</button></div>`;
    return;
  }
  const q = g2_questions[g2_idx];
  const pool = q.type === 'equip' ? EQUIP_POOL : LOC_POOL;
  const isMulti = q.correct.length > 1;
  const distractors = pickDistractors(pool, q.correct, 4 - q.correct.length);
  const options = shuffle([...q.correct, ...distractors]);
  const questionText = sportQuestionText(q.type, q.sport);
  app.innerHTML = `
    ${progressRow(g2_idx+1, g2_questions.length, g2_score)}
    <div class="panel">
      <div class="stage-title">${q.type==='equip' ? '🎒 Equipment' : '📍 Where?'}</div>
      ${imgFrameHTML(q.sport)}
      <div class="question-text">${questionText}</div>
      ${isMulti ? `<div style="text-align:center;font-weight:800;color:var(--plum);font-size:13px;margin:-6px 0 14px;">👉 Choose both correct answers!</div>` : ''}
      <div class="options-grid">
        ${options.map(o => `<button class="opt-btn" onclick="g2_answer(this,'${o}')">${o}</button>`).join('')}
      </div>
    </div>`;
  app._g2correct = q.correct;
  app._g2selected = [];
}
function g2_answer(btn, chosen){
  if(btn.classList.contains('correct')) return;
  if(app._g2correct.includes(chosen) && !app._g2selected.includes(chosen)){
    btn.classList.add('correct');
    btn.onclick = null;
    app._g2selected.push(chosen);
    showFeedback(true);
    if(app._g2selected.length === app._g2correct.length){
      g2_score++;
      document.querySelectorAll('.opt-btn').forEach(b=>b.onclick=null);
      setTimeout(()=>{ g2_idx++; renderGame2Round(); }, 950);
    }
  } else {
    btn.classList.add('wrong');
    showFeedback(false);
    setTimeout(()=>btn.classList.remove('wrong'), 400);
  }
}

/* ======================= GAME 3: Sentence scramble (-ing) ======================= */
let g3_order = [], g3_idx = 0, g3_score = 0, g3_target = [], g3_built = [];

function sentenceFor(sport){
  const ingWord = sport.id === 'swimming' ? 'swimming' : (sport.id === 'running' ? 'running' : null);
  if(BARE_ING.includes(sport.id)){
    return ['I','like',`${sport.id === 'swimming' ? 'swimming.' : 'running.'}`];
  }
  return ['I','like','playing',`${sport.name.toLowerCase().replace(' ','_TT_')}.`];
}
function displayWord(w, sport){
  if(w.includes('_TT_')) return sport.name.toLowerCase() + '.'; // multi-word sport name join
  return w;
}
function startGame3(){
  menuBtn.style.display = 'inline-block';
  g3_order = shuffle(SPORTS);
  g3_idx = 0; g3_score = 0;
  renderGame3Round();
}

  }
  const sport = g3_order[g3_idx];
  g3_target = sentenceFor(sport).map(w => displayWord(w, sport));
  g3_built = [];

}

/* ---- Game 4A: matching puzzle ---- */
let g4a_pairs = [], g4a_selLeft = null, g4a_selRight = null, g4a_matched = 0, g4a_score = 0;

function startGame4A(){
  g4a_pairs = VERB_PAIRS;
  g4a_selLeft = null; g4a_selRight = null; g4a_matched = 0; g4a_score = 0;
  renderGame4A();
}
function renderGame4A(){
  if(g4a_matched >= g4a_pairs.length){
    app.innerHTML = `
      <div class="panel">${endScreenHTML(g4a_score, g4a_pairs.length, 'startGame4A', '🧩', 'Puzzle complete!', 'You got')}</div>
      <div style="text-align:center;margin-top:10px;"><button class="ghost-btn" onclick="startGame4Menu()">⬅ More Game 4 activities</button></div>`;
    return;
  }
  const leftShuffled = shuffle(g4a_pairs.map(p=>p.base));
  const rightShuffled = shuffle(g4a_pairs.map(p=>p.ing));
  app._g4aLeftOrder = leftShuffled;
  app._g4aRightOrder = rightShuffled;
  app.innerHTML = `
    ${progressRow(g4a_matched, g4a_pairs.length, g4a_score)}
    <div class="panel">
      <div class="stage-title">🧩 Match the puzzle! <small>Click a verb, then its correct -ing form</small></div>
      <div class="match-cols">
        <div class="match-col" id="g4aLeft">
          ${leftShuffled.map(w => `<button class="puzzle-piece" data-w="${w}" onclick="g4a_pickLeft(this,'${w}')">${w}</button>`).join('')}
        </div>
        <div class="match-col" id="g4aRight">
          ${rightShuffled.map(w => `<button class="puzzle-piece right-col" data-w="${w}" onclick="g4a_pickRight(this,'${w}')">${w}</button>`).join('')}
        </div>
      </div>
    </div>`;
}
function g4a_pickLeft(btn, w){
  document.querySelectorAll('#g4aLeft .puzzle-piece').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
  g4a_selLeft = {btn, w};
  g4a_tryMatch();
}
function g4a_pickRight(btn, w){
  document.querySelectorAll('#g4aRight .puzzle-piece').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
  g4a_selRight = {btn, w};
  g4a_tryMatch();
}
function g4a_tryMatch(){
  if(!g4a_selLeft || !g4a_selRight) return;
  const pair = g4a_pairs.find(p => p.base === g4a_selLeft.w);
  if(pair && pair.ing === g4a_selRight.w){
    g4a_selLeft.btn.classList.remove('selected');
    g4a_selRight.btn.classList.remove('selected');
    g4a_selLeft.btn.classList.add('matched');
    g4a_selRight.btn.classList.add('matched');
    g4a_selLeft.btn.onclick = null;
    g4a_selRight.btn.onclick = null;
    showFeedback(true);
    g4a_matched++; g4a_score++;
    g4a_selLeft = null; g4a_selRight = null;
    setTimeout(renderGame4A, 700);
  } else {
    g4a_selLeft.btn.classList.add('wrongpick');
    g4a_selRight.btn.classList.add('wrongpick');
    showFeedback(false);
    setTimeout(()=>{
      if(g4a_selLeft){ g4a_selLeft.btn.classList.remove('wrongpick','selected'); }
      if(g4a_selRight){ g4a_selRight.btn.classList.remove('wrongpick','selected'); }
      g4a_selLeft = null; g4a_selRight = null;
    }, 500);
  }
}

/* ---- Game 4D: feeling sentence builder ---- */
let g4d_order = [], g4d_idx = 0, g4d_score = 0, g4d_target = [], g4d_built = [], g4d_total = 8;

function feelingSentenceFor(sport, feeling){

}

  g4d_order = [];

      <div class="chip-pool" id="g4dpool">
        ${shuffled.map(item => `<button class="word-chip" data-idx="${item.i}" onclick="g4d_pick(this,${item.i})">${item.w}</button>`).join('')}

    </div>`;
}
function g4d_pick(btn, idx){
  const needIdx = g4d_built.length;
  if(idx === needIdx){
    g4d_built.push(idx);
    btn.classList.add('used');
    const strip = document.getElementById('g4dstrip');
    if(g4d_built.length === 1) strip.innerHTML = '';
    const slot = document.createElement('span');
    slot.className = 'word-chip-slot';
    slot.textContent = g4d_target[idx];
    strip.appendChild(slot);
    if(g4d_built.length === g4d_target.length){
      showFeedback(true);

      setTimeout(()=>{ g4d_idx++; renderGame4D(); }, 1000);
