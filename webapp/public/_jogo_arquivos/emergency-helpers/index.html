<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Was or Were Rescue</title>
<style>
  :root{
    --bg:#EAF4FF;
    --surface:#FFFFFF;
    --surface-2:#F3F8FF;
    --ink:#16233F;
    --muted:#5B6B8C;
    --line:#D7E6FB;
    --was:#FF6B35;
    --was-soft:#FFE4D6;
    --was-ink:#8A3200;
    --were:#2D6CDF;
    --were-soft:#DCE9FF;
    --were-ink:#0B2E73;
    --success:#1F9D68;
    --success-bg:#E3F7EC;
    --error:#E5484D;
    --error-bg:#FDEAEA;
    --warn:#F2B705;
    --shadow:rgba(22,35,63,0.14);
    --radius-lg:26px;
    --radius-md:16px;
    --radius-sm:10px;
    --font-display:-apple-system, "Segoe UI Rounded", "SF Pro Rounded", "Segoe UI", Verdana, sans-serif;
    --font-body:-apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono:ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0D1526;
      --surface:#16213B;
      --surface-2:#1C2A4A;
      --ink:#EAF1FF;
      --muted:#9FB0D0;
      --line:#24345A;
      --was:#FF8657;
      --was-soft:#3A2416;
      --was-ink:#FFD9C4;
      --were:#6FA3FF;
      --were-soft:#152A4D;
      --were-ink:#CFE1FF;
      --success:#3DDC97;
      --success-bg:#0F2F24;
      --error:#FF7A7E;
      --error-bg:#3A1518;
      --warn:#FFD166;
      --shadow:rgba(0,0,0,0.45);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0D1526;
    --surface:#16213B;
    --surface-2:#1C2A4A;
    --ink:#EAF1FF;
    --muted:#9FB0D0;
    --line:#24345A;
    --was:#FF8657;
    --was-soft:#3A2416;
    --was-ink:#FFD9C4;
    --were:#6FA3FF;
    --were-soft:#152A4D;
    --were-ink:#CFE1FF;
    --success:#3DDC97;
    --success-bg:#0F2F24;
    --error:#FF7A7E;
    --error-bg:#3A1518;
    --warn:#FFD166;
    --shadow:rgba(0,0,0,0.45);
  }

  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  img{ max-width:100%; }
  h1,h2,h3{ font-family:var(--font-display); text-wrap:balance; margin:0; }
  button{ font-family:inherit; }
  :focus-visible{ outline:3px solid var(--were); outline-offset:2px; border-radius:8px; }

  #app{ min-height:100vh; display:flex; flex-direction:column; }

  /* ---------- Ambient background ---------- */
  .ambient{
    position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none;
  }
  .blob{
    position:absolute; border-radius:50%; filter:blur(60px); opacity:.35;
  }
  .blob.fire{ width:38vmax; height:38vmax; background:var(--was); top:-12vmax; left:-10vmax; animation:drift1 26s ease-in-out infinite alternate; }
  .blob.police{ width:34vmax; height:34vmax; background:var(--were); bottom:-14vmax; right:-8vmax; animation:drift2 30s ease-in-out infinite alternate; }
  @keyframes drift1{ from{ transform:translate(0,0) scale(1);} to{ transform:translate(6vmax,4vmax) scale(1.08);} }
  @keyframes drift2{ from{ transform:translate(0,0) scale(1);} to{ transform:translate(-5vmax,-6vmax) scale(1.1);} }
  @media (prefers-reduced-motion: reduce){
    .blob.fire, .blob.police{ animation:none; }
  }

  /* ---------- Top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:5;
    display:flex; align-items:center; gap:14px;
    padding:14px 20px;
    background:color-mix(in srgb, var(--surface) 92%, transparent);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .topbar[hidden]{ display:none; }
  .icon-btn{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--surface-2); color:var(--ink);
    border:1px solid var(--line); border-radius:999px;
    padding:9px 16px; font-size:.95rem; font-weight:600;
    cursor:pointer; transition:transform .15s ease, background .15s ease;
  }
  .icon-btn:hover{ transform:translateY(-1px); background:var(--were-soft); }
  .topbar-title{ font-family:var(--font-display); font-weight:700; font-size:1.05rem; flex:1; min-width:0; }
  .topbar-meta{ display:flex; align-items:center; gap:14px; }
  .score-pill{
    font-family:var(--font-mono); font-variant-numeric:tabular-nums;
    background:var(--surface-2); border:1px solid var(--line); border-radius:999px;
    padding:6px 14px; font-weight:700; font-size:.9rem; white-space:nowrap;
  }
  .progress-track{
    width:120px; height:10px; border-radius:999px; background:var(--surface-2);
    border:1px solid var(--line); overflow:hidden;
  }
  .progress-fill{
    height:100%; border-radius:999px;
    background:linear-gradient(90deg, var(--was), var(--were));
    width:0%; transition:width .4s ease;
  }

  /* ---------- Home ---------- */
  .home{ flex:1; max-width:1080px; margin:0 auto; padding:56px 24px 80px; width:100%; }
  .hero{ text-align:center; margin-bottom:46px; }
  .hero .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-size:.8rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
    color:var(--were-ink); background:var(--were-soft); border-radius:999px; padding:6px 16px;
    margin-bottom:18px;
  }
  .hero h1{ font-size:clamp(2rem, 4.2vw, 3rem); margin-bottom:14px; }
  .hero h1 .was{ color:var(--was); }
  .hero h1 .were{ color:var(--were); }
  .hero p{ color:var(--muted); font-size:1.05rem; max-width:560px; margin:0 auto; }

  .rule-strip{
    display:flex; flex-wrap:wrap; justify-content:center; gap:12px;
    margin:28px auto 0; max-width:640px;
  }
  .rule-chip{
    display:flex; align-items:center; gap:10px;
    background:var(--surface); border:1px solid var(--line); border-radius:999px;
    padding:10px 18px; box-shadow:0 4px 14px var(--shadow);
  }
  .rule-chip b{ font-family:var(--font-mono); }
  .rule-chip.was b{ color:var(--was); }
  .rule-chip.were b{ color:var(--were); }

  .card-grid{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr));
    gap:22px; margin-top:44px;
  }
  .game-card{
    text-align:left; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius-lg); padding:24px; cursor:pointer;
    box-shadow:0 6px 18px var(--shadow);
    transition:transform .18s ease, box-shadow .18s ease;
    display:flex; flex-direction:column; gap:12px; color:var(--ink);
  }
  .game-card:hover{ transform:translateY(-4px); box-shadow:0 12px 26px var(--shadow); }
  .game-card .badge{
    width:56px; height:56px; border-radius:16px; display:flex; align-items:center; justify-content:center;
    font-size:1.7rem; background:var(--surface-2);
  }
  .game-card h3{ font-size:1.15rem; }
  .game-card p{ margin:0; color:var(--muted); font-size:.92rem; }
  .game-card .tag{
    align-self:flex-start; font-size:.75rem; font-weight:700; letter-spacing:.03em;
    color:var(--muted); background:var(--surface-2); border-radius:999px; padding:4px 10px;
  }

  .home-footer{ text-align:center; margin-top:56px; color:var(--muted); font-size:.85rem; }

  /* ---------- Stage ---------- */
  .stage{ flex:1; max-width:820px; margin:0 auto; padding:32px 20px 70px; width:100%; }
  .stage[hidden]{ display:none; }
  .panel{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg);
    padding:clamp(20px, 4vw, 40px); box-shadow:0 8px 24px var(--shadow);
  }
  .panel h2{ font-size:1.5rem; margin-bottom:8px; }
  .panel .sub{ color:var(--muted); margin-bottom:22px; font-size:.98rem; }
  .phase-badge{
    display:inline-block; font-size:.75rem; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
    color:var(--were-ink); background:var(--were-soft); border-radius:999px; padding:5px 12px; margin-bottom:14px;
  }

  .prompt{
    font-size:clamp(1.15rem, 2.6vw, 1.5rem); font-weight:600; text-align:center;
    padding:30px 16px; background:var(--surface-2); border-radius:var(--radius-md);
    margin-bottom:24px; line-height:1.6;
  }
  .prompt .blank{
    display:inline-block; min-width:70px; border-bottom:3px solid var(--muted);
    margin:0 4px;
  }

  .choice-row{ display:flex; gap:16px; justify-content:center; flex-wrap:wrap; }
  .choice-btn{
    font-family:var(--font-display); font-size:1.15rem; font-weight:700;
    border-radius:999px; padding:16px 40px; border:2px solid transparent; cursor:pointer;
    transition:transform .15s ease, filter .15s ease; min-width:140px;
  }
  .choice-btn:hover{ transform:translateY(-2px); filter:brightness(1.04); }
  .choice-btn:active{ transform:translateY(0); }
  .choice-btn.was{ background:var(--was-soft); color:var(--was-ink); border-color:var(--was); }
  .choice-btn.were{ background:var(--were-soft); color:var(--were-ink); border-color:var(--were); }
  .choice-btn:disabled{ opacity:.55; cursor:default; transform:none; }
  .choice-btn.correct-flash{ outline:3px solid var(--success); }
  .choice-btn.wrong-flash{ outline:3px solid var(--error); }

  .feedback{
    margin-top:20px; padding:16px 18px; border-radius:var(--radius-md);
    display:flex; gap:12px; align-items:flex-start; font-size:.98rem;
    animation:pop .25s ease;
  }
  @keyframes pop{ from{ transform:scale(.96); opacity:0;} to{ transform:scale(1); opacity:1; } }
  .feedback.good{ background:var(--success-bg); color:var(--success); }
  .feedback.bad{ background:var(--error-bg); color:var(--error); }
  .feedback .fb-icon{ font-size:1.3rem; line-height:1; }
  .feedback .fb-text{ color:var(--ink); }
  .feedback .fb-text b{ color:inherit; }

  .stage-actions{ display:flex; justify-content:center; gap:14px; margin-top:26px; }
  .btn{
    font-family:var(--font-display); font-weight:700; font-size:1rem;
    border-radius:999px; padding:13px 30px; border:2px solid var(--line);
    background:var(--surface-2); color:var(--ink); cursor:pointer;
    transition:transform .15s ease, background .15s ease;
  }
  .btn:hover{ transform:translateY(-2px); }
  .btn.primary{ background:linear-gradient(90deg, var(--was), var(--were)); color:#fff; border-color:transparent; }

  /* ---------- Unscramble ---------- */
  .build-area{
    min-height:74px; border:2px dashed var(--line); border-radius:var(--radius-md);
    display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:14px;
    margin-bottom:18px; background:var(--surface-2);
  }
  .build-area.empty::before{ content:"Tap the words below to build the sentence"; color:var(--muted); font-size:.9rem; }
  .word-bank{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
  .tile{
    font-family:var(--font-mono); font-size:1.02rem; font-weight:600;
    background:var(--surface); border:2px solid var(--line); border-radius:12px;
    padding:10px 16px; cursor:pointer; transition:transform .12s ease, background .12s ease;
  }
  .tile:hover{ transform:translateY(-2px); }
  .tile.placed{ background:var(--were-soft); border-color:var(--were); }
  .tile.used{ visibility:hidden; }

  /* ---------- Story / dialogue ---------- */
  .story-text{ font-size:1.08rem; line-height:2.1; }
  .story-text .blank-wrap{ display:inline-flex; gap:6px; margin:0 3px; vertical-align:middle; }
  .mini-btn{
    font-family:var(--font-mono); font-weight:700; font-size:.85rem;
    border-radius:8px; padding:4px 10px; border:2px solid var(--line); cursor:pointer; background:var(--surface);
  }
  .mini-btn.was{ border-color:var(--was); color:var(--was-ink); }
  .mini-btn.were{ border-color:var(--were); color:var(--were-ink); }
  .mini-btn:disabled{ cursor:default; }
  .mini-btn.chosen-correct{ background:var(--success-bg); color:var(--success); border-color:var(--success); }
  .mini-btn.chosen-wrong{ background:var(--error-bg); color:var(--error); border-color:var(--error); }
  .mini-btn.reveal-correct{ background:var(--success-bg); color:var(--success); border-color:var(--success); }

  .dialogue{ display:flex; flex-direction:column; gap:14px; }
  .bubble-row{ display:flex; gap:12px; align-items:flex-end; }
  .bubble-row.right{ flex-direction:row-reverse; }
  .avatar{
    width:38px; height:38px; border-radius:50%; background:var(--surface-2);
    display:flex; align-items:center; justify-content:center; font-size:1.15rem; flex:none;
    border:1px solid var(--line);
  }
  .bubble{
    background:var(--surface-2); border-radius:16px; padding:12px 16px; font-size:1rem;
    max-width:80%; line-height:1.55;
  }
  .bubble-row.right .bubble{ background:var(--were-soft); }

  /* ---------- End screen ---------- */
  .end-screen{ text-align:center; }
  .end-emoji{ font-size:3.4rem; margin-bottom:10px; }
  .end-score{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:2.2rem; font-weight:700; margin:8px 0 4px; }
  .end-msg{ color:var(--muted); margin-bottom:26px; font-size:1.02rem; }
  .review-list{ text-align:left; background:var(--surface-2); border-radius:var(--radius-md); padding:16px 20px; margin:20px 0; font-size:.92rem; }
  .review-list li{ margin-bottom:8px; }

  /* ---------- Mixed challenge types ---------- */
  .ab-grid{ display:grid; gap:14px; }
  .ab-option{
    text-align:left; background:var(--surface-2); border:2px solid var(--line); border-radius:var(--radius-md);
    padding:16px 20px; cursor:pointer; font-size:1.02rem; transition:transform .12s ease, border-color .12s ease;
  }
  .ab-option:hover{ transform:translateY(-2px); }
  .ab-option .letter{ font-family:var(--font-mono); font-weight:700; color:var(--muted); margin-right:8px; }
  .ab-option.correct-flash{ border-color:var(--success); background:var(--success-bg); }
  .ab-option.wrong-flash{ border-color:var(--error); background:var(--error-bg); }

  .type-input-row{ display:flex; gap:12px; justify-content:center; margin-bottom:8px; flex-wrap:wrap; }
  .type-input{
    font-family:var(--font-mono); font-size:1.1rem; padding:12px 16px; border-radius:12px;
    border:2px solid var(--line); background:var(--surface); color:var(--ink); width:160px; text-align:center;
  }

  .judge-row{ display:flex; gap:14px; justify-content:center; margin-bottom:6px; }
  .judge-btn{
    font-family:var(--font-display); font-weight:700; border-radius:999px; padding:14px 28px;
    border:2px solid var(--line); cursor:pointer; background:var(--surface-2); font-size:1.02rem;
  }
  .judge-btn.correct-choice{ border-color:var(--success); color:var(--success); }
  .judge-btn.incorrect-choice{ border-color:var(--error); color:var(--error); }

  @media (max-width:520px){
    .choice-btn{ padding:14px 26px; min-width:auto; flex:1; }
    .topbar{ flex-wrap:wrap; }
    .topbar-meta{ width:100%; justify-content:space-between; }
  }
</style>
</head>
<body>
<div id="app">
  <div class="ambient" aria-hidden="true"><div class="blob fire"></div><div class="blob police"></div></div>

  <header class="topbar" id="topbar" hidden>
    <button class="icon-btn" onclick="App.goHome()">← Menu</button>
    <div class="topbar-title" id="topbarTitle"></div>
    <div class="topbar-meta">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="score-pill" id="scorePill">⭐ 0</div>
    </div>
  </header>

  <main class="home" id="home">
    <div class="hero">
      <div class="eyebrow">🚨 Emergency Helpers • Past Continuous</div>
      <h1>Was<span class="was"> or </span><span class="were">Were</span>?</h1>
      <p>Five quick games to help you choose the right word every time. Pick any game below — you don't need to finish one to try another!</p>
      <div class="rule-strip">
        <div class="rule-chip was">👤 <span>one person / thing →</span> <b>WAS</b></div>
        <div class="rule-chip were">👥 <span>two or more →</span> <b>WERE</b></div>
      </div>
    </div>

    <div class="card-grid">
      <button class="game-card" onclick="App.open('g1')">
        <div class="badge">🚒</div>
        <span class="tag">Game 1 · Choose</span>
        <h3>Was or Were?</h3>
        <p>Click the correct word for pronouns, names, and tricky subjects like "the firefighters".</p>
      </button>
      <button class="game-card" onclick="App.open('g2')">
        <div class="badge">🧩</div>
        <span class="tag">Game 2 · Unscramble</span>
        <h3>Unscramble the Sentence</h3>
        <p>Put the mixed-up words in the right order — watch out for sneaky extra words!</p>
      </button>
      <button class="game-card" onclick="App.open('g3')">
        <div class="badge">📖</div>
        <span class="tag">Game 3 · Story</span>
        <h3>What Was Happening?</h3>
        <p>Fill in the blanks of a rescue-day story about Peter, Anna, and the town's helpers.</p>
      </button>
      <button class="game-card" onclick="App.open('g4')">
        <div class="badge">💬</div>
        <span class="tag">Game 4 · Conversation</span>
        <h3>Two Friends Talking</h3>
        <p>Help Sam and Lily finish their conversation about an exciting rescue day.</p>
      </button>
      <button class="game-card" onclick="App.open('g5')">
        <div class="badge">🎯</div>
        <span class="tag">Game 5 · Mixed Challenge</span>
        <h3>Mixed Challenge</h3>
        <p>The hardest game! Choose, judge, fix, and unscramble — all mixed together.</p>
      </button>
    </div>
    <div class="home-footer">Made for English class · Practice as many times as you like 🌟</div>
  </main>

  <main class="stage" id="stage" hidden>
    <div class="panel" id="stageContent"></div>
  </main>
</div>

<script>
(function(){
  "use strict";

  /* ============== Utilities ============== */
  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }
  function el(html){
    const t = document.createElement('template');
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  }
  function esc(s){ return String(s); }

  /* ============== App shell ============== */
  const App = {
    current:null,
    open(id){
      document.getElementById('home').hidden = true;
      document.getElementById('stage').hidden = false;
      document.getElementById('topbar').hidden = false;
      this.current = id;
      Games[id].start();
    },
    goHome(){
      document.getElementById('home').hidden = false;
      document.getElementById('stage').hidden = true;
      document.getElementById('topbar').hidden = true;
      this.current = null;
    },
    setTopbar(title){
      document.getElementById('topbarTitle').textContent = title;
    },
    setProgress(index, total){
      const pct = total ? Math.round((index/total)*100) : 0;
      document.getElementById('progressFill').style.width = pct + '%';
    },
    setScore(score){
      document.getElementById('scorePill').textContent = '⭐ ' + score;
    },
    stageEl(){ return document.getElementById('stageContent'); }
  };
  window.App = App;

  function explain(subject, plural, extra){
    const word = plural ? 'WERE' : 'WAS';
    const count = plural ? 'two or more' : 'one';
    return `<b>${subject}</b> = ${count} → <b>${word}</b>.` + (extra ? ' ' + extra : '');
  }

  function endScreenHTML(opts){
    const pct = Math.round((opts.score/opts.total)*100);
    let emoji, msg;
    if(pct >= 90){ emoji='🏆'; msg='Amazing! You really know your WAS and WERE!'; }
    else if(pct >= 70){ emoji='🎉'; msg='Great job! You are getting really good at this.'; }
    else if(pct >= 50){ emoji='💪'; msg='Good effort! A little more practice and you\'ll master it.'; }
    else{ emoji='🌱'; msg='Nice try! Play again to practice — you will get better each time.'; }
    return `
      <div class="end-screen">
        <div class="end-emoji">${emoji}</div>
        <h2>${opts.title}</h2>
        <div class="end-score">${opts.score} / ${opts.total}</div>
        <p class="end-msg">${msg}</p>
        ${opts.reviewHTML || ''}
        <div class="stage-actions">
          <button class="btn" onclick="App.goHome()">Back to Menu</button>
          <button class="btn primary" onclick="Games.${opts.gameId}.start()">Play Again</button>
        </div>
      </div>`;
  }

  /* ==================================================================
     GAME 1 — WAS or WERE? (phased multiple choice)
  ================================================================== */
  const g1Phase1 = [
    {s:'I', v:'climbing', a:'was', ex:explain('I', false)},
    {s:'You', v:'running', a:'were', ex:'<b>You</b> always uses <b>WERE</b>, even for one person!'},
    {s:'He', v:'playing', a:'was', ex:explain('He', false)},
    {s:'She', v:'riding', a:'was', ex:explain('She', false)},
    {s:'It', v:'raining near the river', a:'was', ex:explain('It', false)},
    {s:'We', v:'singing', a:'were', ex:explain('We', true)},
    {s:'They', v:'running', a:'were', ex:explain('They', true)},
  ];
  const g1Phase2 = [
    {s:'Peter', v:'climbing', a:'was', ex:explain('Peter', false, 'One boy.')},
    {s:'Maria', v:'singing', a:'was', ex:explain('Maria', false)},
    {s:'Peter and John', v:'running', a:'were', ex:explain('Peter and John', true, 'Two boys.')},
    {s:'John and Mary', v:'playing', a:'were', ex:explain('John and Mary', true)},

          </div>
          <div id="fbArea"></div>`;
      } else if(item.type === 'type'){
        App.stageEl().innerHTML = heading + `
          <div class="prompt">${esc(item.sentence).replace('___','<span class="blank">___</span>')}</div>
          <div class="type-input-row">
            <input type="text" class="type-input" id="typeInput" placeholder="was / were" autocomplete="off">
            <button class="btn primary" onclick="Games.g5.answerType()">Check ✓</button>
          </div>
          <div id="fbArea"></div>`;
        document.getElementById('typeInput') && document.getElementById('typeInput').addEventListener('keydown', e=>{ if(e.key==='Enter') Games.g5.answerType(); });
      } else if(item.type === 'ab'){
        const showRightFirst = Math.random() < 0.5;
        const optA = showRightFirst ? item.right : item.wrong;
        const optB = showRightFirst ? item.wrong : item.right;
        App.stageEl().innerHTML = heading + `
          <div class="prompt" style="font-size:1.05rem;">Which sentence is correct?</div>
          <div class="ab-grid">
            <div class="ab-option" id="optA" onclick="Games.g5.answerAB('A','${optA===item.right?'right':'wrong'}')"><span class="letter">A</span>${esc(optA)}</div>
            <div class="ab-option" id="optB" onclick="Games.g5.answerAB('B','${optB===item.right?'right':'wrong'}')"><span class="letter">B</span>${esc(optB)}</div>
          </div>
          <div id="fbArea"></div>`;
      } else if(item.type === 'judge'){
        App.stageEl().innerHTML = heading + `
          <div class="prompt">${esc(item.sentence)}</div>
          <div class="judge-row">
            <button class="judge-btn" id="btnCorrect" onclick="Games.g5.answerJudge(true)">✔ Correct</button>
            <button class="judge-btn" id="btnIncorrect" onclick="Games.g5.answerJudge(false)">✘ Incorrect</button>
          </div>
          <div id="fbArea"></div>`;
      } else if(item.type === 'unscramble'){
        this.state = {built:[], bank: shuffle(item.words.concat(item.distractors)).map((w,i)=>({word:w,id:i,used:false}))};
        App.stageEl().innerHTML = heading + `
          <div class="build-area empty" id="buildArea"></div>
          <div class="word-bank" id="wordBank"></div>
          <div id="fbArea"></div>
          <div class="stage-actions">
            <button class="btn" onclick="Games.g5.undoUns()">↩ Undo</button>
            <button class="btn primary" id="checkBtn" onclick="Games.g5.answerUnscramble()">Check ✓</button>
          </div>`;
        this.renderUnsTiles();
      }
    },
    lockChoiceButtons(){
      ['btnWas','btnWere'].forEach(id=>{ const b=document.getElementById(id); if(b) b.disabled=true; });
    },
    finishStep(correct, message){
      if(correct) this.score++;
      App.setScore(this.score);
      document.getElementById('fbArea').innerHTML = `<div class="feedback ${correct?'good':'bad'}">
          <div class="fb-icon">${correct?'✅':'💡'}</div>
          <div class="fb-text">${message}</div>
        </div>
        <div class="stage-actions"><button class="btn primary" onclick="Games.g5.next()">${this.idx+1<this.items.length?'Next →':'See Results'}</button></div>`;
    },
    answerChoose(choice){
      const item = this.items[this.idx];
      const correct = choice === item.a;
      this.lockChoiceButtons();
      document.getElementById(choice==='was'?'btnWas':'btnWere').classList.add(correct?'correct-flash':'wrong-flash');
      if(!correct) document.getElementById(item.a==='was'?'btnWas':'btnWere').classList.add('correct-flash');
      this.finishStep(correct, (correct?'Great!':'Not quite!') + ' ' + item.ex);
    },
    answerType(){
      const item = this.items[this.idx];
      const input = document.getElementById('typeInput');
      const val = (input.value||'').trim().toLowerCase();
      const correct = val === item.a;
      input.disabled = true;
      this.finishStep(correct, (correct?'Great!':`Not quite — the answer is "${item.a}".`) + ' ' + item.ex);
    },
    answerAB(letter, kind){
      const correct = kind === 'right';
      document.getElementById('optA').style.pointerEvents='none';
      document.getElementById('optB').style.pointerEvents='none';
      document.getElementById(letter==='A'?'optA':'optB').classList.add(correct?'correct-flash':'wrong-flash');
      const item = this.items[this.idx];
      this.finishStep(correct, (correct?'Yes! That\'s the correct sentence.':'Not this one.') + ' ' + item.ex);
    },
    answerJudge(saidCorrect){
      const item = this.items[this.idx];
      const correct = saidCorrect === item.isCorrect;
      document.getElementById('btnCorrect').disabled = true;
      document.getElementById('btnIncorrect').disabled = true;
      document.getElementById(saidCorrect?'btnCorrect':'btnIncorrect').classList.add(correct?'correct-choice':'incorrect-choice');
      let msg;
      if(item.isCorrect){
        msg = (correct ? 'Right, it was already correct! ' : 'Actually it was already correct! ') + item.ex;
      } else {
        msg = (correct ? 'Right, it was incorrect. ' : 'Look again — it was incorrect. ') + `The fix is: <b>${item.fix}</b> ${item.ex}`;
      }
      this.finishStep(correct, msg);
    },
    renderUnsTiles(){
      const build = document.getElementById('buildArea');
      const bank = document.getElementById('wordBank');
      build.classList.toggle('empty', this.state.built.length===0);
      build.innerHTML = this.state.built.map(t=>`<span class="tile placed" onclick="Games.g5.removeUns(${t.id})">${t.word}</span>`).join('');
      bank.innerHTML = this.state.bank.filter(t=>!t.used).map(t=>`<span class="tile" onclick="Games.g5.pickUns(${t.id})">${t.word}</span>`).join('');
    },
    pickUns(id){
      const tile = this.state.bank.find(t=>t.id===id);
      if(!tile||tile.used) return;
      tile.used = true;
      this.state.built.push(tile);
      this.renderUnsTiles();
    },
    removeUns(id){
      const i = this.state.built.findIndex(t=>t.id===id);
      if(i===-1) return;
      this.state.built[i].used = false;
      this.state.built.splice(i,1);
      this.renderUnsTiles();
    },
    undoUns(){
      if(!this.state.built.length) return;
      const t = this.state.built.pop();
      t.used = false;
      this.renderUnsTiles();
    },
    answerUnscramble(){
      const item = this.items[this.idx];
      const answer = this.state.built.map(t=>t.word);
      const matches = (target) => answer.length===target.length && answer.every((w,i)=>w===target[i]);
      const correct = matches(item.words) || (item.altWords && matches(item.altWords));
      document.getElementById('checkBtn').setAttribute('disabled','true');
      const correctSentence = item.words.join(' ') + '.';
      this.finishStep(correct, correct ? 'Perfect order!' : `The correct sentence is: <b>${correctSentence}</b>`);
    },
    next(){ this.idx++; this.render(); }
  };

  const Games = { g1:Game1, g2:Game2, g3:Game3, g4:Game4, g5:Game5 };
  window.Games = Games;

})();
</script>
