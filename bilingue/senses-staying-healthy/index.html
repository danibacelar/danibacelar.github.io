<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Science Review Games: Senses and Staying Healthy</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%E2%AD%90%3C/text%3E%3C/svg%3E">
<style>
:root{
  --ink:#2b2d42; --white:#fff;
  --accent:#ff8a3d; --accent2:#1fb6c9; --bg:#fff3d6; --soft:#ffe2b0;
  --good:#2fb36d; --bad:#e5484d;
  --font:"Baloo 2","Fredoka","Trebuchet MS","Comic Sans MS",system-ui,-apple-system,"Segoe UI",sans-serif;
}
body[data-topic="senses"]{--accent:#ff8a3d;--accent2:#1fb6c9;--bg:#fff3d6;--soft:#ffe2b0}
body[data-topic="healthy"]{--accent:#3fae49;--accent2:#ff7043;--bg:#e8f7da;--soft:#cfeeb6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:var(--font);color:var(--ink);background:var(--bg);user-select:none;-webkit-user-select:none;overflow-x:hidden}
body[data-screen="home"]{background:linear-gradient(160deg,#bfe8ff 0%,#fff3c4 55%,#ffd9e0 100%)}
img{-webkit-user-drag:none;user-drag:none}
button{font-family:inherit;color:inherit;cursor:pointer;border:0}
.screen{display:none;min-height:100vh;min-height:100dvh;padding:14px 18px 28px;max-width:1180px;margin:0 auto}
.screen.active{display:flex;flex-direction:column}

/* buttons */
.btn{background:var(--white);border-radius:999px;padding:10px 20px;font-size:clamp(16px,2.2vw,22px);font-weight:800;box-shadow:0 4px 0 rgba(0,0,0,.15);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.15)}
.btn.primary{background:var(--accent);color:#fff}
.btn.big{padding:14px 28px;font-size:clamp(18px,2.6vw,26px)}
.round{width:52px;height:52px;border-radius:50%;background:var(--accent2);color:#fff;font-size:24px;box-shadow:0 4px 0 rgba(0,0,0,.18);flex:none}
.round:active{transform:translateY(3px)}

/* home */
#home{align-items:center;justify-content:center;text-align:center;gap:10px}
#home .hero{display:flex;align-items:center;gap:18px;justify-content:center;flex-wrap:wrap}
#home .hero img{width:clamp(110px,16vw,170px);animation:float 3s ease-in-out infinite}
#home h1{margin:0;font-size:clamp(34px,6vw,64px);line-height:1;color:#ff6b3d;text-shadow:0 4px 0 rgba(255,255,255,.8)}
#home .sub{margin:6px 0 0;font-size:clamp(18px,2.6vw,28px);font-weight:700;color:#445}
.topics{display:flex;gap:28px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.topic-btn{width:min(380px,86vw);border-radius:32px;padding:22px 18px 20px;color:#fff;box-shadow:0 8px 0 rgba(0,0,0,.18);display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .1s}
.topic-btn:hover{transform:translateY(-4px) rotate(-1deg)}
.topic-btn:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.topic-btn img{width:clamp(110px,14vw,150px);background:#fff;border-radius:50%;padding:12px}
.topic-btn b{font-size:clamp(30px,4.4vw,46px);line-height:1.05}
.topic-btn small{font-size:clamp(16px,2vw,22px);font-weight:700;opacity:.95}
.topic-btn.senses{background:linear-gradient(160deg,#ff9a4d,#ff6b3d)}
.topic-btn.healthy{background:linear-gradient(160deg,#58c75d,#2c9a4a)}
.stars-row{font-size:clamp(20px,3vw,30px);letter-spacing:2px;min-height:1.2em}

/* menu */
.bar{display:flex;align-items:center;gap:12px;justify-content:space-between}
.bar h2{margin:0;font-size:clamp(26px,4vw,44px);color:var(--accent);flex:1;text-align:center}
#menu .award{margin:10px auto 0;background:#fff7c2;border:3px dashed #f2b400;border-radius:22px;padding:10px 20px;font-size:clamp(18px,2.6vw,26px);font-weight:800;display:none;align-items:center;gap:12px}
#menu .award img{width:52px}
.gamegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px 20px;margin-top:20px}
.gcard{background:#fff;border-radius:26px;padding:14px 14px;min-height:118px;display:flex;align-items:center;gap:14px;box-shadow:0 6px 0 rgba(0,0,0,.12);text-align:left;position:relative;transition:transform .1s}
.gcard:hover{transform:translateY(-3px)}
.gcard:active{transform:translateY(3px)}
.gcard .num{position:absolute;top:-10px;left:-6px;background:var(--accent);color:#fff;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:20px;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.gcard img{width:84px;height:84px;object-fit:contain;background:var(--soft);border-radius:20px;padding:8px;flex:none}
.gcard .t{font-size:clamp(18px,2.2vw,24px);font-weight:900;line-height:1.1}
.gcard .s{font-size:24px;margin-top:6px;letter-spacing:1px}
.gcard .s .off{filter:grayscale(1);opacity:.35}

/* game */
.topbar{display:flex;align-items:center;gap:12px}
.topbar .title{flex:1;text-align:center;font-size:clamp(20px,3vw,32px);font-weight:900;color:var(--accent)}
.instr{display:flex;align-items:center;gap:12px;background:#fff;border-radius:22px;padding:10px 14px;margin-top:10px;box-shadow:0 4px 0 rgba(0,0,0,.1);font-size:clamp(16px,2.3vw,24px);font-weight:700}
.dots{display:flex;gap:8px;justify-content:center;margin:12px 0 4px;min-height:18px;flex-wrap:wrap}
.dots i{width:16px;height:16px;border-radius:50%;background:rgba(0,0,0,.14);transition:all .2s}
.dots i.on{background:var(--good);transform:scale(1.2)}
.count{font-weight:900;font-size:20px;text-align:center;color:var(--accent)}
#stage{flex:1;display:flex;flex-direction:column;position:relative}

/* match */
.match{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:12vw;margin:14px auto 0;width:min(900px,100%);align-items:center}
.match .col{display:flex;flex-direction:column;gap:12px}
.match svg.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3;overflow:visible}
.node{position:relative;background:#fff;border:4px solid var(--accent2);border-radius:22px;padding:8px 14px;display:flex;align-items:center;gap:10px;min-height:84px;font-weight:900;font-size:clamp(18px,2.6vw,28px);touch-action:none;cursor:grab;box-shadow:0 4px 0 rgba(0,0,0,.12);transition:transform .1s}
.node img{width:64px;height:64px;object-fit:contain;flex:none}
.node span{line-height:1.1}
.node.left{justify-content:flex-start;padding-right:26px}
.node.right{padding-left:26px}
.node .dot{position:absolute;top:50%;width:22px;height:22px;margin-top:-11px;border-radius:50%;background:var(--accent2);border:3px solid #fff;box-shadow:0 0 0 2px var(--accent2)}
.node.left .dot{right:-13px}
.node.right .dot{left:-13px}
.node.sel{background:#fff7c2;transform:scale(1.04)}
.node.done{border-color:var(--good);background:#e6f9ee;cursor:default}
.node.done .dot{background:var(--good);box-shadow:0 0 0 2px var(--good)}

/* sort */
.sort{display:flex;flex-direction:column;gap:14px;margin-top:8px;flex:1}
.boxes{display:grid;gap:12px;grid-template-columns:repeat(var(--n),1fr)}
.box{background:#fff;border:4px dashed var(--c,#999);border-radius:22px;padding:8px 8px 10px;min-height:150px;display:flex;flex-direction:column;align-items:center;gap:4px;transition:background .15s,transform .15s}
.box.hot{background:#fff7c2;transform:scale(1.03)}
.box .bhead{display:flex;align-items:center;gap:8px;font-size:clamp(17px,2.3vw,26px);font-weight:900;color:var(--c,#444);text-align:center;line-height:1.05;justify-content:center}
.box .bhead img{width:44px;height:44px;object-fit:contain}
.box .bhint{font-size:clamp(12px,1.5vw,15px);font-weight:700;color:#667;text-align:center;min-height:0}
.slot{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:4px}
.mini{display:flex;flex-direction:column;align-items:center;background:var(--soft);border-radius:14px;padding:4px 6px;animation:pop .35s;font-size:12px;font-weight:800}
.mini img{width:clamp(40px,5.6vw,62px);height:clamp(40px,5.6vw,62px);object-fit:contain}
.tray{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;background:rgba(255,255,255,.65);border-radius:26px;padding:14px;min-height:130px;align-content:flex-start;margin-top:18px}
.card{width:clamp(86px,11vw,118px);background:#fff;border-radius:18px;padding:6px 4px 4px;display:flex;flex-direction:column;align-items:center;box-shadow:0 4px 0 rgba(0,0,0,.14);touch-action:none;cursor:grab;font-weight:800;font-size:clamp(12px,1.5vw,16px);text-align:center;line-height:1.05}
.card img{width:clamp(62px,8vw,88px);height:clamp(62px,8vw,88px);object-fit:contain}
.card.lifted{opacity:.25}
.card.sel{outline:5px solid #ffc400;transform:scale(1.06)}
.card.placed{display:none}
.card.shake,.box.shake,.node.shake{animation:shake .4s}
.ghost{position:fixed;z-index:999;pointer-events:none;transform:translate(-50%,-50%) scale(1.15) rotate(-3deg);box-shadow:0 14px 24px rgba(0,0,0,.3);opacity:.96}

/* pick */
.pick{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:10px}
.listen{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}
.listen .btn{display:flex;align-items:center;gap:10px}
.ptext{font-size:clamp(18px,2.6vw,28px);font-weight:800;background:#fff;border-radius:18px;padding:10px 18px;max-width:900px;text-align:center;min-height:0}
.ptext.hidden{display:none}
.choices{display:grid;gap:16px;width:min(980px,100%);grid-template-columns:repeat(4,1fr)}
.choice{background:#fff;border:5px solid transparent;border-radius:26px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 6px 0 rgba(0,0,0,.14);font-weight:900;font-size:clamp(16px,2.2vw,26px);transition:transform .1s}
.choice img{width:100%;max-width:180px;aspect-ratio:1;object-fit:contain}
.choice:hover{transform:translateY(-3px)}
.choice.good{border-color:var(--good);background:#e6f9ee;animation:pop .4s}
.choice.wrong{border-color:var(--bad);background:#ffeaea;opacity:.55;pointer-events:none;animation:shake .4s}
.yn-sentence{font-size:clamp(26px,4.4vw,48px);font-weight:900;background:#fff;border-radius:28px;padding:26px 30px;text-align:center;max-width:900px;box-shadow:0 6px 0 rgba(0,0,0,.12);line-height:1.2}
.yn-btns{display:flex;gap:30px;margin-top:6px}
.yn{min-width:min(220px,38vw);padding:20px 12px;border-radius:30px;font-size:clamp(30px,5vw,52px);font-weight:900;color:#fff;box-shadow:0 8px 0 rgba(0,0,0,.2)}
.yn:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(0,0,0,.2)}
.yn.yes{background:var(--good)} .yn.no{background:var(--bad)}
.yn.dim{opacity:.35;pointer-events:none}
.verdict{min-height:1.4em;font-size:clamp(20px,3vw,32px);font-weight:900}
.verdict.good{color:var(--good)} .verdict.bad{color:var(--bad)}

/* result */
#result{align-items:center;justify-content:center;text-align:center;gap:14px}
#result img{width:clamp(130px,20vw,210px);animation:float 2.6s ease-in-out infinite}
#result h2{margin:0;font-size:clamp(34px,6vw,60px);color:var(--accent)}
#result .stars{font-size:clamp(50px,9vw,96px);letter-spacing:6px}
#result .stars .off{filter:grayscale(1);opacity:.25}
#result .btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:8px}
#result .badge{background:#fff7c2;border:3px dashed #f2b400;border-radius:22px;padding:10px 20px;font-size:clamp(18px,2.6vw,28px);font-weight:900;display:none}

/* confetti */
.confetti{position:fixed;top:-20px;width:12px;height:18px;z-index:1000;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes pop{0%{transform:scale(.5)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

@media (max-width:900px){.gamegrid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:620px){.gamegrid{grid-template-columns:1fr}}
@media (max-width:760px){
  .choices{grid-template-columns:repeat(2,1fr)}
  .boxes{grid-template-columns:repeat(2,1fr)}
  .match{gap:14vw}
  .node img{width:48px;height:48px}
  .node{min-height:70px;padding:6px 10px}
}

/* menu sections / info */
.sec{grid-column:1/-1;margin:14px 0 -6px;font-size:clamp(18px,2.4vw,26px);font-weight:900;color:var(--accent);display:flex;align-items:center;gap:12px}
.sec::after{content:"";flex:1;height:5px;border-radius:5px;background:var(--soft)}
.minfo{text-align:center;font-size:clamp(16px,2.2vw,22px);font-weight:800;margin-top:6px;color:#556}
@media (max-width:900px){.sec{grid-column:1/-1}}

/* pick extras */
.pimg{width:clamp(120px,18vw,190px);height:clamp(120px,18vw,190px);object-fit:contain;background:#fff;border-radius:26px;padding:8px;box-shadow:0 6px 0 rgba(0,0,0,.12)}
.ptext2{font-size:clamp(26px,4.2vw,46px);font-weight:900;background:#fff;border-radius:26px;padding:20px 28px;text-align:center;max-width:900px;box-shadow:0 6px 0 rgba(0,0,0,.12);line-height:1.2}
.ptext2 u{color:var(--good);text-decoration:none;border-bottom:5px solid var(--good);padding:0 8px}
.choices.txt{grid-template-columns:repeat(2,1fr);max-width:820px}
.choice.txt{min-height:92px;justify-content:center;font-size:clamp(22px,3.2vw,36px);text-align:center;line-height:1.1}

/* memory */
.memory{display:grid;gap:12px;grid-template-columns:repeat(var(--cols),1fr);width:min(var(--w,860px),100%);margin:12px auto 0}
.mcard{perspective:900px;aspect-ratio:1/.92;background:none;padding:0;border:0}
.mcard .inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .45s}
.mcard.flip .inner{transform:rotateY(180deg)}
.mcard .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 5px 0 rgba(0,0,0,.14);padding:6px;font-weight:900}
.mcard .front{background:linear-gradient(160deg,var(--accent),var(--accent2));color:#fff;font-size:clamp(30px,5vw,56px)}
.mcard .back{background:#fff;transform:rotateY(180deg);font-size:clamp(13px,1.7vw,21px);text-align:center;line-height:1.05;overflow:hidden;overflow-wrap:anywhere}
.mcard .back img{width:60%;max-height:52%;object-fit:contain}
.mcard .back span{display:block;max-width:100%}
.mcard.done .back{background:#e6f9ee;box-shadow:0 0 0 5px var(--good)}
.mcard.bad .back{box-shadow:0 0 0 5px var(--bad)}

/* spell */
.spell{display:flex;flex-direction:column;align-items:center;gap:16px;margin-top:10px}
.slots{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;min-height:70px}
.slot-l{width:clamp(48px,8vw,76px);height:clamp(58px,9vw,88px);border-bottom:6px solid var(--accent2);background:#fff;border-radius:14px 14px 0 0;display:grid;place-items:center;font-size:clamp(34px,5.6vw,58px);font-weight:900;color:var(--good)}
.tiles{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;max-width:800px}
.tile{width:clamp(54px,8.4vw,82px);height:clamp(54px,8.4vw,82px);border-radius:18px;background:var(--accent);color:#fff;font-size:clamp(32px,5.4vw,54px);font-weight:900;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.tile:active{transform:translateY(3px)}
.tile.used{visibility:hidden}
.tile.shake{animation:shake .4s;background:var(--bad)}

/* learn */
.learn{display:flex;flex-direction:column;align-items:center;gap:14px;margin:10px auto 0;width:min(900px,100%)}
.lcard{background:#fff;border-radius:32px;padding:20px 26px;box-shadow:0 8px 0 rgba(0,0,0,.12);width:100%;text-align:center;border-top:12px solid var(--c,var(--accent))}
.lcard h3{margin:0 0 4px;font-size:clamp(28px,4.6vw,48px);color:var(--c,var(--accent));line-height:1.05}
.lfoods{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.lfoods div{display:flex;flex-direction:column;align-items:center;font-weight:800;font-size:clamp(14px,2vw,20px)}
.lfoods img{width:clamp(70px,11vw,120px);height:clamp(70px,11vw,120px);object-fit:contain}
.chip{display:inline-block;background:var(--c,var(--accent));color:#fff;border-radius:999px;padding:6px 20px;font-weight:900;font-size:clamp(18px,2.6vw,28px);margin:6px 0}
.lcard p{margin:8px 0;font-size:clamp(19px,2.8vw,30px);font-weight:700;line-height:1.25}
.lnav{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center}
</style>
</head>
<body data-screen="home">
<div id="app">

  <!-- HOME -->
  <section id="home" class="screen active">
    <div class="hero">
      <img src="images/mascot.webp" alt="">
      <div>
        <h1>Let's Review!</h1>
        <p class="sub">Choose a topic and play</p>
      </div>
      <button class="round" id="btnWelcome" title="Listen" aria-label="Listen">🔊</button>
    </div>
    <div class="topics">
      <button class="topic-btn senses" data-topic="senses">
        <img src="images/icon_senses.webp" alt="">
        <b>Senses</b><small>Unit 5</small>
        <span class="stars-row" id="sumSenses"></span>
      </button>
      <button class="topic-btn healthy" data-topic="healthy">
        <img src="images/icon_healthy.webp" alt="">
        <b>Staying Healthy</b><small>Unit 6</small>
        <span class="stars-row" id="sumHealthy"></span>
      </button>
    </div>
  </section>

  <!-- MENU -->
  <section id="menu" class="screen">
    <div class="bar">
      <button class="btn" id="btnHome">← Home</button>
      <h2 id="menuTitle"></h2>
      <span style="width:110px"></span>
    </div>
    <div class="minfo" id="menuInfo"></div>
    <div class="award" id="award"><img src="images/mascot.webp" alt=""><span id="awardText"></span></div>
    <div class="gamegrid" id="gameGrid"></div>
  </section>

  <!-- GAME -->
  <section id="game" class="screen">
    <header class="topbar">
      <button class="btn" id="btnMenu">← Menu</button>
      <div class="title" id="gTitle"></div>
      <button class="round" id="btnMute" title="Sound on/off" aria-label="Sound on/off">🔊</button>
    </header>
    <div class="instr"><button class="round" id="btnInstr" aria-label="Listen to the instructions">🔊</button><span id="instrText"></span></div>
    <div class="dots" id="dots"></div>
    <main id="stage"></main>
  </section>

  <!-- RESULT -->
  <section id="result" class="screen">
    <img src="images/mascot.webp" alt="">
    <h2>Great work!</h2>
    <div class="stars" id="rStars"></div>
    <div class="badge" id="rBadge"></div>
    <div class="btns">
      <button class="btn big" id="rAgain">↻ Play again</button>
      <button class="btn big primary" id="rNext">Next game ▶</button>
      <button class="btn big" id="rMenu">← Menu</button>
    </div>
  </section>
</div>

<script>
"use strict";
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sample = (a, n) => shuffle(a).slice(0, n);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const img = n => `images/${n}.webp`;
const pick1 = a => a[Math.floor(Math.random() * a.length)];

/* ---------- audio ---------- */
let muted = false, curAudio = null, curFin = null, AC = null;
function stopVoice() {
  if (curAudio) { try { curAudio.pause(); } catch (e) {} curAudio = null; }
  try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) {}
  if (curFin) { const f = curFin; curFin = null; f(); }
}
function speak(text) {
  return new Promise(res => {
    try {
      const s = window.speechSynthesis;
      if (!s || muted || !text) return res();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US'; u.rate = 0.88;
      const vs = s.getVoices();

/* ---------- game shell ---------- */
function setDots(done, total) {

async function intro(r) { await play(r.g.inst, r.g.text); return r.tok === TOK; }
function finish(r) {
  if (r.tok !== TOK) return;
  const m = r.mistakes, lim = r.g.maxM || [1, 4];
  const stars = m <= lim[0] ? 3 : (m <= lim[1] ? 2 : 1);
  const T = TOPICS[topicKey];
  const before = topicCount(topicKey);
  const key = gkey(topicKey, r.g);
  prog[key] = Math.max(prog[key] || 0, stars); saveProg();
  const after = topicCount(topicKey);
  show('result');
  $('#rStars').innerHTML = starsHTML(stars);

}

/* ---------- GAME: match (draw lines) ---------- */
async function matchGame(r, cfg) {
  const stage = $('#stage');
  const wrap = el('div', 'match');
  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS, 'svg'); svg.setAttribute('class', 'lines');
  const L = el('div', 'col'), R = el('div', 'col');
  wrap.append(svg, L, R); stage.appendChild(wrap);
  const mk = (it, side) => {
    const n = el('div', 'node ' + side);
    n.dataset.side = side; n.dataset.id = it.id;
    const im = it.img ? `<img src="${img(it.img)}" draggable="false">` : '';
    n.innerHTML = side === 'left' ? `${im}<span>${it.label}</span><i class="dot"></i>` : `<i class="dot"></i>${im}<span>${it.label}</span>`;
    n._it = it; return n;
  };
  shuffle(cfg.left).forEach(it => L.appendChild(mk(it, 'left')));
  shuffle(cfg.right).forEach(it => R.appendChild(mk(it, 'right')));
  const total = cfg.left.length; const conns = []; let sel = null, temp = null;
  setDots(0, total);
  const anchor = n => { const a = n.getBoundingClientRect(), w = wrap.getBoundingClientRect(); return { x: (n.dataset.side === 'left' ? a.right : a.left) - w.left, y: a.top + a.height / 2 - w.top }; };
  const mkLine = (a, b, col, dash) => { const l = document.createElementNS(svgNS, 'line'); l.setAttribute('x1', a.x); l.setAttribute('y1', a.y); l.setAttribute('x2', b.x); l.setAttribute('y2', b.y); l.setAttribute('stroke', col); l.setAttribute('stroke-width', 7); l.setAttribute('stroke-linecap', 'round'); if (dash) l.setAttribute('stroke-dasharray', '2 12'); return l; };
  const draw = () => { svg.innerHTML = ''; conns.forEach(c => svg.appendChild(mkLine(anchor(c.l), anchor(c.r), '#2fb36d'))); };
  const onResize = () => draw(); window.addEventListener('resize', onResize);
  const clearSel = () => { if (sel) sel.classList.remove('sel'); sel = null; };
  function connect(a, b) {
    if (r.tok !== TOK) return;
    const l = a.dataset.side === 'left' ? a : b, rr = a.dataset.side === 'left' ? b : a;
    if (l._it.id === rr._it.id) {
      l.classList.add('done'); rr.classList.add('done'); conns.push({ l, r: rr }); draw(); ding(); setDots(conns.length, total);
      (async () => { if (l._it.audio) await play(l._it.audio); if (rr._it.audio && r.tok === TOK) await play(rr._it.audio); })();
      if (conns.length === total) setTimeout(() => { window.removeEventListener('resize', onResize); finish(r); }, 1700);
    } else {
      r.mistakes++; buzz(); [l, rr].forEach(n => { n.classList.remove('shake'); void n.offsetWidth; n.classList.add('shake'); });
    }
  }
  wrap.addEventListener('pointerdown', e => {
    const n = e.target.closest('.node'); if (!n || n.classList.contains('done')) return;
    e.preventDefault();
    const sx = e.clientX, sy = e.clientY; let moved = false;
    const mv = ev => {
      if (!moved && Math.hypot(ev.clientX - sx, ev.clientY - sy) > 10) moved = true;
      if (moved) { if (temp) temp.remove(); const w = wrap.getBoundingClientRect(); temp = mkLine(anchor(n), { x: ev.clientX - w.left, y: ev.clientY - w.top }, '#1fb6c9', true); svg.appendChild(temp); }
    };
    const up = ev => {
      window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up);
      if (temp) { temp.remove(); temp = null; }
      if (moved) {
        const t = document.elementFromPoint(ev.clientX, ev.clientY); const m = t && t.closest('.node');
        if (m && m !== n && m.dataset.side !== n.dataset.side && !m.classList.contains('done')) { clearSel(); connect(n, m); }
      } else {
        if (n._it.audio) play(n._it.audio);
        if (!sel) { sel = n; n.classList.add('sel'); }
        else if (sel === n) clearSel();
        else if (sel.dataset.side !== n.dataset.side) { const s = sel; clearSel(); connect(s, n); }
        else { clearSel(); sel = n; n.classList.add('sel'); }
      }
    };
    window.addEventListener('pointermove', mv); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
  });
  await intro(r);
}

        if (bx) attempt(card, bx);
      } else { if (sel === card) clearSel(); else { clearSel(); sel = card; card.classList.add('sel'); } }
    };
    window.addEventListener('pointermove', mv); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);

    const pi = el('img', 'pimg'); pi.src = img(w.img); pi.draggable = false;
    const sp = el('button', 'btn big primary', '🔊 Listen'); sp.onclick = () => play(wordAud(w.word) || null, w.word);
    const slots = el('div', 'slots'); const sl = letters.map(() => { const s = el('div', 'slot-l', ''); slots.appendChild(s); return s; });
    const tiles = el('div', 'tiles');
    let tl = shuffle(letters.map((l, k) => ({ l, k })));
    if (letters.length > 1 && tl.every((t, k) => t.l === letters[k])) tl = tl.reverse();
    tl.forEach(t => {
      const b = el('button', 'tile', t.l);
      b.onclick = async () => {
        if (locked || r.tok !== TOK || b.classList.contains('used')) return; ac();
        if (t.l === letters[pos]) {
          b.classList.add('used'); sl[pos].textContent = t.l; pos++; tick();
          if (pos === letters.length) {
            locked = true; ding(); await sleep(250); await play(wordAud(w.word) || null, w.word); await cheer(); await sleep(350);
            if (r.tok !== TOK) return;
            i++; if (i >= words.length) { setDots(i, words.length); finish(r); } else round(false);
          }
        } else { r.mistakes++; buzz(); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); setTimeout(() => b.classList.remove('shake'), 450); }
      };
      tiles.appendChild(b);
    });
    p.append(pi, sp, slots, tiles); stage.appendChild(p);
    if (first) { const ok = await intro(r); if (!ok) return; }
    await play(wordAud(w.word) || null, w.word);
  }
  await round(true);
}

/* ---------- GAME: learn (explanations) ---------- */
async function learnGame(r) {
  const stage = $('#stage');
  const S = [
    { key:'starchy', color:GROUPS.starchy.color, title:'Starchy foods', foods:['bread', 'rice', 'pasta'], nut:'carbohydrates', lines:['Starchy foods are bread, rice, pasta and potatoes.', 'Carbohydrates give you energy to do different things.'] },
    { key:'protein', color:GROUPS.protein.color, title:'Meat, fish, eggs and pulses', foods:['eggs', 'fish', 'beans'], nut:'proteins', lines:['This group has meat, fish, eggs and pulses, like beans.', 'Proteins help your body grow.'] },
    { key:'fruitveg', color:GROUPS.fruitveg.color, title:'Fruit and vegetables', foods:['orange', 'carrots'], nut:'vitamins and minerals', lines:['Vitamins help your body stay healthy. Vitamin C is in fruit and vegetables.', 'Eat at least five portions of fruit and vegetables a day.'] },
    { key:'dairy', color:GROUPS.dairy.color, title:'Dairy', foods:['milk', 'cheese'], nut:'proteins and minerals', lines:['Dairy foods are milk and cheese.', 'Minerals, like calcium, make your body strong.'] },
    { key:'oils', color:GROUPS.oils.color, title:'Oils and spreads', foods:['olive_oil', 'butter'], nut:'fats', lines:['Oils and spreads have fats.', 'Fats give you energy. Eat only a little fat.'] },
    { key:'balanced', color:'#3fae49', title:'A balanced diet', foods:[], icon:'icon_healthy', nut:'balanced diet', lines:['A balanced diet has food from all the food groups.', 'Fats, added sugars and salt are not healthy in large amounts.'] }
  ];
  let i = 0;
  const say = (s, k) => play('learn_' + (k + 1), s.title + '. ' + s.lines.join(' '));
  async function slide(first) {
    if (r.tok !== TOK) return;
    const s = S[i];
    stage.innerHTML = ''; setDots(i, S.length);
    const w = el('div', 'learn');
    const card = el('div', 'lcard'); card.style.setProperty('--c', s.color);
    const foods = s.foods.length ? `<div class="lfoods">${s.foods.map(f => `<div><img src="${img('food_' + f)}" draggable="false"><span>${FOODS[f]}</span></div>`).join('')}</div>` : `<div class="lfoods"><div><img src="${img(s.icon)}" draggable="false"></div></div>`;
    card.innerHTML = `<h3>${s.title}</h3>${foods}<div class="chip">${s.key === 'balanced' ? 'healthy and strong' : s.nut}</div>${s.lines.map(l => `<p>${l}</p>`).join('')}`;
    const nav = el('div', 'lnav');
    const back = el('button', 'btn big', '◀ Back'); back.onclick = () => { if (i > 0) { i--; slide(false); } }; if (i === 0) back.style.visibility = 'hidden';
    const lis = el('button', 'btn big primary', '🔊 Listen'); lis.onclick = () => say(s, i);
    const next = el('button', 'btn big primary', i === S.length - 1 ? 'Finish ✔' : 'Next ▶');
    next.onclick = () => { ac(); if (i === S.length - 1) { setDots(S.length, S.length); finish(r); } else { i++; slide(false); } };
    nav.append(back, lis, next);
    w.append(card, nav); stage.appendChild(w);
    if (first) { const ok = await intro(r); if (!ok) return; }
    await say(s, i);
  }
  await slide(true);
}

refreshHome();
